let qzSigningReady = false;
async function setupQzSigning(){
  if(qzSigningReady) return;
  await loadForge();
  qz.security.setCertificatePromise((resolve)=> resolve(QZ_CERTIFICATE));
  qz.security.setSignatureAlgorithm('SHA512');
  qz.security.setSignaturePromise((toSign)=> (resolve, reject)=>{
    try{
      const pk = forge.pki.privateKeyFromPem(QZ_PRIVATE_KEY);
      const md = forge.md.sha512.create();
      md.update(toSign, 'utf8');
      const signature = pk.sign(md);
      resolve(forge.util.encode64(signature));
    }catch(err){ reject(err); }
  });
  qzSigningReady = true;
}
async function qzConnect(){
  await withTimeout(loadQzTray(), 6000);
  await withTimeout(setupQzSigning(), 6000);
  if(!qz.websocket.isActive()){
    await withTimeout(qz.websocket.connect(), 6000);
  }
}
async function qzListPrinters(){
  await qzConnect();
  return await qz.printers.find();
}
async function printViaQz(text){
  await qzConnect();
  const printerName = localSettings.qzPrinterName;
  if(!printerName) throw new Error('Nenhuma impressora selecionada. Vá em Configuração e escolha a impressora do QZ Tray.');
  const cfg = qz.configs.create(printerName);
  // Comandos ESC/POS: inicializa a impressora, liga negrito, imprime o texto,
  // desliga negrito, alimenta o papel e corta automaticamente.
  const ESC = '\x1B', GS = '\x1D';
  const init    = ESC + '@';          // reseta a impressora pro estado padrão
  const boldOn  = ESC + 'E' + '\x01'; // negrito ligado
  const boldOff = ESC + 'E' + '\x00'; // negrito desligado
  const feedCut = '\n\n\n' + GS + 'V' + 'B' + '\x00'; // alimenta e corta o papel
  const payload = init + boldOn + toPrinterSafeText(text) + boldOff + feedCut;
  await qz.print(cfg, [{ type:'raw', format:'plain', data: payload }]);
}

/* Ponto único de disparo de impressão: decide entre o modo padrão (caixa de
   diálogo do sistema), RawBT (celular) ou QZ Tray (computador), conforme configurado. */
/* Desenha o ticket como uma imagem (PNG) e compartilha como arquivo — apps
   como o PrinterApp/Thermer costumam ter uma função de "imprimir imagem" que
   usa a conexão Bluetooth direta com a impressora, diferente do texto puro
   compartilhado, que cai no sistema de impressão padrão da Apple (AirPrint). */
function buildReceiptCanvas(text){
  const lines = text.split('\n');
  const fontSize = 30;
  const lineHeight = Math.round(fontSize * 1.35);
  const paddingX = 24, paddingY = 24;
  const canvasWidth = 640;
  const canvas = document.createElement('canvas');
  canvas.width = canvasWidth;
  canvas.height = lines.length * lineHeight + paddingY * 2;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000000';
  ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
  ctx.textBaseline = 'top';
  lines.forEach((line, i)=>{
    ctx.fillText(line, paddingX, paddingY + i*lineHeight);
  });
  return canvas;
}
function shareReceiptAsImage(text){
  return new Promise((resolve, reject)=>{
    if(!navigator.share || !navigator.canShare){
      reject(new Error('Compartilhamento de arquivos não suportado neste navegador.'));
      return;
    }
    const canvas = buildReceiptCanvas(toPrinterSafeText(text));
    canvas.toBlob(blob=>{
      if(!blob){ reject(new Error('Não foi possível gerar a imagem do ticket.')); return; }
      const file = new File([blob], 'ticket.png', { type:'image/png' });
      if(!navigator.canShare({ files:[file] })){
        reject(new Error('Compartilhamento de imagens não suportado.'));
        return;
      }
      navigator.share({ files:[file] }).then(resolve).catch(err=>{
        if(err.name==='AbortError') resolve(); // usuário cancelou, não é erro
        else reject(err);
      });
    }, 'image/png');
  });
}
async function triggerPrint(text){
  const method = localSettings.printMethod;

  if(method === 'rawbt'){
    if(!isAndroid()){
      alert('O modo "Direta via RawBT" só funciona no celular Android. Use o modo "QZ Tray" para impressão direta no computador. Por enquanto, vou usar a impressão padrão.');
      document.getElementById('printArea').innerText = text;
      setupPrintLayout();
      window.print();
      return;
    }
    sendToRawBt(text);
    return;
  }

  if(method === 'qz'){
    try{
      await printViaQz(text);
    }catch(e){
      alert('Não foi possível imprimir direto via QZ Tray:\n\n'+e.message+'\n\nUsando a impressão padrão desta vez.');
      document.getElementById('printArea').innerText = text;
      setupPrintLayout();
      window.print();
    }
    return;
  }

  if(method === 'share'){
    try{
      await shareReceiptAsImage(text);
      return;
    }catch(e){
      console.error('Não foi possível compartilhar como imagem, tentando como texto', e);
    }
    if(navigator.share){
      try{
        await navigator.share({ text: toPrinterSafeText(text) });
      }catch(e){
        if(e.name !== 'AbortError'){
          alert('Não foi possível abrir o menu de compartilhar: ' + e.message);
        }
      }
    } else {
      alert('Este navegador não suporta o menu de compartilhar. Atualize o Safari, ou use o modo "Padrão" em Configuração.');
      document.getElementById('printArea').innerText = text;
      setupPrintLayout();
      window.print();
    }
    return;
  }

  document.getElementById('printArea').innerText = text;
  setupPrintLayout();
  window.print();
}

function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Remove automaticamente um fundo claro/uniforme (branco, cinza-claro,
   quadriculado de transparência etc.) de uma imagem, deixando-o transparente.
   Funciona "de fora pra dentro": primeiro aprende a cor do fundo a partir
   dos próprios pixels da borda da imagem, depois espalha por pixels
   vizinhos que batem com essa paleta (preenchimento por inundação) — só
   apaga o fundo que está realmente conectado à borda, então uma cor parecida
   no meio da imagem (ex.: roupa clara do santo/santa) não é afetada, pois
   não está "grudada" na borda. Cada candidato é comparado sempre com a
   paleta de fundo (não com o vizinho anterior), o que evita que o
   preenchimento "vaze" por uma linha de contorno fina e acabe apagando uma
   área colorida do outro lado dela.
   É uma remoção simples e best effort, priorizando nunca danificar o
   assunto da foto: funciona bem para fotos com fundo liso/claro (o caso
   comum de imagens de santos, logos etc.), mas pode deixar um resquício de
   fundo em bolsões pequenos totalmente cercados por contorno (ex.: dentro
   de uma coroa desenhada), e não substitui uma ferramenta de recorte
   profissional para fotos complexas. */
function removeBackgroundToTransparent(canvas, tolerance){
  tolerance = tolerance || 34;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if(w<2 || h<2) return;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const total = w*h;
  const visited = new Uint8Array(total);
  const thresh2 = tolerance*tolerance;
  const stack = new Int32Array(total);
  let sp = 0;
  // Paleta de cores de fundo (até 24 tons claros/neutros distintos): em vez de
  // comparar cada pixel com o vizinho anterior (o que deixaria a "cor de
  // referência" derivar aos poucos até alcançar cores bem diferentes — como
  // costura por uma linha fina de contorno antialiasada até dentro do
  // desenho colorido), todo pixel candidato é comparado com essa paleta
  // ESTÁVEL, aprendida a partir da borda da imagem. Isso evita que o
  // preenchimento "vaze" por uma linha fina e continue apagando uma área
  // sólida colorida do outro lado dela.
  const palette = [];
  const maxPaletteEntries = 24;
  const paletteMinDist2 = 18*18;
  const addToPalette = (r,g,b)=>{
    if(palette.length>=maxPaletteEntries) return;
    // só aceita tons claros e neutros (branco/cinza-claro do fundo/quadriculado) —
    // evita contaminar a paleta com cores de antialiasing/borda do desenho,
    // que fariam o preenchimento (e a etapa 2) apagar partes coloridas da imagem.
    const maxc = Math.max(r,g,b), minc = Math.min(r,g,b);
    const avg = (r+g+b)/3;
    if(avg < 150 || (maxc-minc) > 34) return;
    for(let p=0;p<palette.length;p++){
      const dr=palette[p][0]-r, dg=palette[p][1]-g, db=palette[p][2]-b;
      if((dr*dr+dg*dg+db*db) <= paletteMinDist2) return;
    }
    palette.push([r,g,b]);
  };
  const bestDist2ToPalette = (r,g,b)=>{
    let best = Infinity;
    for(let p=0;p<palette.length;p++){
      const dr=palette[p][0]-r, dg=palette[p][1]-g, db=palette[p][2]-b;
      const d2 = dr*dr+dg*dg+db*db;
      if(d2<best) best=d2;
    }
    return best;
  };
  // 1) Aprende a paleta de fundo a partir dos pixels da própria borda da
  // imagem (moldura ao redor do assunto — o caso normal de uma foto com
  // fundo liso/quadriculado).
  for(let x=0;x<w;x++){
    let o=(0*w+x)*4; addToPalette(data[o],data[o+1],data[o+2]);
    o=((h-1)*w+x)*4; addToPalette(data[o],data[o+1],data[o+2]);
  }
  for(let y=0;y<h;y++){
    let o=(y*w+0)*4; addToPalette(data[o],data[o+1],data[o+2]);
    o=(y*w+(w-1))*4; addToPalette(data[o],data[o+1],data[o+2]);
  }
  if(!palette.length) return; // borda não parece ter fundo claro — não mexe na imagem
  // 2) Sementes: pixels de borda que batem com a paleta. Se o assunto da
  // foto encostar na borda da imagem (ex.: um ombro cortado bem na margem),
  // ele não bate com a paleta clara e não vira semente — não arrasta o
  // resto do assunto junto ao apagar o fundo.
  const pushIfMatch = (x,y)=>{
    const i = y*w+x;
    if(visited[i]) return;
    const o = i*4;
    if(bestDist2ToPalette(data[o],data[o+1],data[o+2]) <= thresh2){
      visited[i]=1; stack[sp++]=i;
    }
  };
  for(let x=0;x<w;x++){ pushIfMatch(x,0); pushIfMatch(x,h-1); }
  for(let y=0;y<h;y++){ pushIfMatch(0,y); pushIfMatch(w-1,y); }
  // 3) Preenchimento por inundação: só espalha para vizinhos que também
  // batem com a paleta estável (não com o pixel vizinho anterior).
  while(sp>0){
    const i = stack[--sp];
    const x = i % w, y = (i / w) | 0;
    const o = i*4;
    data[o+3] = 0; // torna este pixel transparente
    const nb = [
      x>0 ? i-1 : -1, x<w-1 ? i+1 : -1,
      y>0 ? i-w : -1, y<h-1 ? i+w : -1
    ];
    for(let k=0;k<4;k++){
      const ni = nb[k];
      if(ni<0 || visited[ni]) continue;
      const no = ni*4;
      const r = data[no], g = data[no+1], b = data[no+2];
      if(bestDist2ToPalette(r,g,b) <= thresh2){
        visited[ni]=1;
        stack[sp++]=ni;
      }
    }
  }
  // Observação: de propósito NÃO existe uma segunda etapa tentando apagar
  // "ilhas" de fundo cercadas por contorno (ex.: um pedacinho de
  // quadriculado dentro de uma coroa desenhada) — testes mostraram que
  // qualquer critério simples pra isso também acaba apagando pedaços da
  // própria imagem quando ela tem áreas claras divididas por linhas finas
  // (ex.: uma roupa branca cortada por um desenho). Ou seja: pode sobrar um
  // pouco de fundo em bolsões bem pequenos e cercados, mas a imagem original
  // nunca é danificada — a prioridade aqui é nunca apagar parte do assunto.
  ctx.putImageData(imgData,0,0);
}
/* Carrega a imagem, redimensiona e remove o fundo — usado nas fotos
   laterais da tela de login. Sempre exporta em PNG (o formato precisa
   suportar transparência; JPEG não suporta). */
function processCutoutPhoto(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        removeBackgroundToTransparent(canvas);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function cameraIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;

async function saveProduct(id){
  const name = document.getElementById('f_name').value.trim();
  const price = readMoneyInput('f_price');
  const category = document.getElementById('f_category').value.trim();
  const barcode = document.getElementById('f_barcode').value.trim();
  const stockRaw = document.getElementById('f_stock').value;
  const alwaysAvailable = document.getElementById('f_alwaysAvailable').checked;
  if(!name || price<=0){ alert('Preencha nome e um preço válido maior que zero.'); return; }
  const newStock = stockRaw===''? null : parseInt(stockRaw);
  const photo = window._photoDataUrl || null;
  window._photoDataUrl = null;

  const existingProduct = id ? state.products.find(x=>x.id===id) : null;
  const originalStock = existingProduct ? existingProduct.stock : null;
  // calcula a DIFERENÇA que o usuário quis fazer no estoque (não o valor
  // absoluto), pra aplicar como ajuste — assim, se uma venda tiver
  // acontecido em outro aparelho enquanto este formulário estava aberto,
  // essa edição não desfaz aquela baixa de estoque sem querer
  const stockDelta = (typeof originalStock === 'number' && typeof newStock === 'number') ? (newStock - originalStock) : null;

  await runStateTransaction((s)=>{
    if(id){
      const p = s.products.find(x=>x.id===id);
      if(!p) return;
      Object.assign(p, { name, price, category, barcode, photo, alwaysAvailable });
      if(stockDelta!==null && typeof p.stock==='number'){
        p.stock = Math.max(0, p.stock + stockDelta);
      } else {
        p.stock = newStock;
      }
    } else {
      s.products.push({ id:uid(), name, price, category, barcode, stock:newStock, photo, alwaysAvailable });
    }
  });
  closeModal();
}
async function deleteProduct(id){
  if(!confirm('Excluir este produto?')) return;
  await runStateTransaction((s)=>{
    s.products = s.products.filter(p=>p.id!==id);
  });
}

    <input id="counted" type="text" inputmode="decimal" placeholder="0,00" oninput="updateDiff(${expected})">
    <div class="row" style="margin-top:8px;"><span class="muted small">Diferença</span><span id="diffVal" style="font-weight:800;">R$ 0,00</span></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmCloseCash()">Confirmar fechamento</button>
    </div>
  `);
}
function updateDiff(expected){
  const counted = readMoneyInput('counted');
  const diff = counted - expected;
  const el = document.getElementById('diffVal');
  el.textContent = (diff>=0?'+':'') + fmt(diff);
  el.style.color = Math.abs(diff)<0.01 ? 'var(--success)' : 'var(--danger)';
}
/* Recalcula o resumo do caixa em cima de um estado específico (usado dentro
   da transação, pra garantir que o fechamento sempre usa os dados mais
   recentes do servidor, não uma cópia que pode estar desatualizada). */
function computeCashSummary(s){
  const cash = s.cash;
  const sessionSales = cash.openedAt ? s.sales.filter(x=> x.date >= cash.openedAt && !x.cancelled) : [];
  const byPayment = {};
  sessionSales.forEach(sale=>{ salePayments(sale).forEach(p=>{ byPayment[p.method] = (byPayment[p.method]||0) + p.amount; }); });
  const suprimentos = cash.movements.filter(m=>m.type==='suprimento').reduce((a,m)=>a+m.amount,0);
  const sangrias = cash.movements.filter(m=>m.type==='sangria').reduce((a,m)=>a+m.amount,0);
  const totalSales = sessionSales.reduce((a,x)=>a+x.total,0);
  const dinheiro = byPayment['Dinheiro']||0;
  const expected = cash.openingAmount + dinheiro + suprimentos - sangrias;
  return { sessionSales, byPayment, suprimentos, sangrias, totalSales, expected };
}
async function confirmCloseCash(){
  const counted = readMoneyInput('counted');
  let resultSession = null;
  await runStateTransaction((s)=>{
    if(!s.cash.isOpen) return; // já foi fechado por outro aparelho enquanto isso
    const { sessionSales, byPayment, suprimentos, sangrias, totalSales, expected } = computeCashSummary(s);
    const session = {
      ...s.cash,
      closedAt: new Date().toISOString(),
      expected, countedAmount: counted, difference: counted - expected, totalSales,
      byPayment, suprimentos, sangrias, salesCount: sessionSales.length
    };
    s.cashSessions.push(session);
    s.cash = { isOpen:false, openedAt:null, openingAmount:0, movements:[] };
    resultSession = session;
  });
  closeModal();
  if(resultSession){ showCashCloseReceipt(resultSession); }
  else { alert('O caixa já tinha sido fechado (talvez por outro aparelho).'); }
}

/* Extrai a data (AAAA-MM-DD) no fuso horário LOCAL do aparelho, não em UTC.
   Isso é importante: o Brasil é UTC-3, então usar toISOString() (que é UTC)
   faz vendas feitas entre 21h e 23h59 caírem erroneamente no dia seguinte. */
function localDateISO(d){
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${year}-${month}-${day}`;
}
function todayISO(){ return localDateISO(new Date()); }
function saleDateISO(s){ return localDateISO(new Date(s.date)); }
function salesInPeriod(fromStr, toStr){
  return state.sales.filter(s=>{ const d = saleDateISO(s); return d>=fromStr && d<=toStr; });
}
function summarizeItems(items){
  return items.map(it=>`${it.qty}x ${it.name}`).join(', ');
}
function renderHistorico(){

      <button class="btn btn-sm btn-ghost" style="flex:1;" onclick="setHistPeriod(30)">Últimos 30 dias</button>
    </div>
    <div class="small muted" style="margin-bottom:14px; text-align:center;">
      ${fromStr===toStr
        ? `Mostrando apenas: <b>${new Date(fromStr+'T00:00:00').toLocaleDateString('pt-BR')}</b>`
        : `⚠️ Mostrando período de <b>${new Date(fromStr+'T00:00:00').toLocaleDateString('pt-BR')}</b> até <b>${new Date(toStr+'T00:00:00').toLocaleDateString('pt-BR')}</b>`}

function productSummaryFromSales(sales){
  const map = {};
  sales.forEach(s=>{
    s.items.forEach(it=>{
      if(!map[it.name]) map[it.name] = { qty:0, total:0 };
      map[it.name].qty += it.qty;
      map[it.name].total += it.price*it.qty;
    });
  });
  return Object.keys(map)
    .map(name=>({ name, qty:map[name].qty, total:map[name].total }))
    .sort((a,b)=> b.qty - a.qty);
}
function renderProductSummaryList(sales){
  const items = productSummaryFromSales(sales);
  if(!items.length) return `<div class="empty" style="padding:14px 10px;">Nenhum produto vendido nesse período.</div>`;
  return items.map((p,i)=>`
    <div class="row" style="padding:8px 0; ${i<items.length-1?'border-bottom:1px solid var(--border);':''}">
      <div>
        <div style="font-weight:700;">${escapeHtml(p.name)}</div>
        <div class="small muted">${p.qty} unidade${p.qty!==1?'s':''} vendida${p.qty!==1?'s':''}</div>
      </div>
      <div style="font-weight:800; color:var(--primary);">${fmt(p.total)}</div>
    </div>
  `).join('');
}
function drawProductChart(){
  const canvas = document.getElementById('prodChart');
  if(!canvas) return;
  const fromStr = window._histFrom || todayISO();
  const toStr = window._histTo || todayISO();
  const sales = salesInPeriod(fromStr, toStr).filter(s=>!s.cancelled);
  const items = productSummaryFromSales(sales).slice(0, 8); // top 8 produtos, senão fica ilegível

  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 180;
  canvas.width = w*ratio; canvas.height = h*ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.clearRect(0,0,w,h);

  if(!items.length){
    ctx.fillStyle = '#8A7F6E';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Nenhum produto vendido nesse período', w/2, h/2);
    return;
  }

  const padLeft = 8, padRight = 8, padTop = 8, padBottom = 8;
  const maxQty = Math.max(...items.map(p=>p.qty), 1);
  const rowH = (h - padTop - padBottom) / items.length;
  const barH = Math.min(22, rowH*0.55);
  const labelW = 92; // espaço reservado pro nome do produto à esquerda
  const valueW = 36; // espaço reservado pro número à direita (nunca corta, mesmo com barra cheia)
  const barAreaW = w - padLeft - padRight - labelW - valueW;
  const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#8A6D46';

  items.forEach((p, idx)=>{
    const cy = padTop + rowH*idx + rowH/2;
    ctx.fillStyle = '#2B2620';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    let label = p.name;
    if(ctx.measureText(label).width > labelW-6){
      while(label.length>3 && ctx.measureText(label+'…').width > labelW-6) label = label.slice(0,-1);
      label += '…';
    }
    ctx.fillText(label, padLeft, cy+4);

    const barW = Math.max(2, (p.qty/maxQty) * barAreaW);
    const bx = padLeft + labelW;
    const by = cy - barH/2;
    ctx.fillStyle = themeColor;
    ctx.beginPath();
    const r = 4;
    ctx.moveTo(bx, by+barH);
    ctx.lineTo(bx, by+r);
    ctx.arcTo(bx, by, bx+r, by, r);
    ctx.lineTo(bx+barW-r, by);
    ctx.arcTo(bx+barW, by, bx+barW, by+r, r);
    ctx.lineTo(bx+barW, by+barH);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2B2620';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(p.qty), bx+barAreaW+6, cy+4);
  });
}
/* ---- Relatório detalhado de vendas (por produto, forma de pagamento, etc.) ---- */
function buildSalesReportText(fromStr, toStr){
  const c = state.config;
  const W = paperCharsWidth();
  const line = ch => ch.repeat(W);
  const center = t => { const pad = Math.max(0, Math.floor((W - t.length)/2)); return ' '.repeat(pad)+t; };
  const rowLR = (l,r) => l + ' '.repeat(Math.max(1, W-l.length-r.length)) + r;

  const sales = salesInPeriod(fromStr, toStr);
  const validSales = sales.filter(s=>!s.cancelled);
  const cancelledCount = sales.length - validSales.length;

  const byPayment = {};
  validSales.forEach(s=>{ salePayments(s).forEach(p=>{ byPayment[p.method] = (byPayment[p.method]||0) + p.amount; }); });

  const productMap = {};
  validSales.forEach(s=>{
    s.items.forEach(it=>{
      if(!productMap[it.name]) productMap[it.name] = { qty:0, total:0 };
      productMap[it.name].qty += it.qty;
      productMap[it.name].total += it.price*it.qty;
    });
  });
  const sortedProducts = Object.keys(productMap).sort((a,b)=>productMap[b].total-productMap[a].total);

  const totalRevenue = validSales.reduce((a,s)=>a+s.total,0);
  const periodoLabel = fromStr===toStr
    ? new Date(fromStr+'T00:00:00').toLocaleDateString('pt-BR')
    : new Date(fromStr+'T00:00:00').toLocaleDateString('pt-BR') + ' a ' + new Date(toStr+'T00:00:00').toLocaleDateString('pt-BR');

  let out = '';
  out += center(c.storeName||'Minha Loja') + '\n';
  out += center('RELATORIO DE VENDAS') + '\n';
  out += line('-') + '\n';
  out += 'Periodo: ' + periodoLabel + '\n';
  out += 'Gerado em: ' + new Date().toLocaleString('pt-BR') + '\n';
  out += line('-') + '\n';
  out += rowLR('Total de vendas', String(validSales.length)) + '\n';
  out += rowLR('Faturamento total', fmt(totalRevenue)) + '\n';
  out += rowLR('Ticket medio', fmt(validSales.length ? totalRevenue/validSales.length : 0)) + '\n';
  if(cancelledCount) out += rowLR('Vendas canceladas', String(cancelledCount)) + '\n';
  out += line('-') + '\n';

  out += center('POR FORMA DE PAGAMENTO') + '\n';
  if(Object.keys(byPayment).length===0){
    out += center('(sem vendas)') + '\n';
  } else {
    Object.keys(byPayment).sort().forEach(p=>{ out += rowLR(p, fmt(byPayment[p])) + '\n'; });
  }
  out += line('-') + '\n';

  out += center('PRODUTOS VENDIDOS') + '\n';
  if(sortedProducts.length===0){
    out += center('(sem vendas)') + '\n';
  } else {
    sortedProducts.forEach(name=>{
      const info = productMap[name];
      out += name + '\n';
      out += rowLR('  ' + info.qty + ' un', fmt(info.total)) + '\n';
    });
  }
  out += line('-') + '\n';
  out += center(c.footer||'') + '\n';
  return out;
}

function drawHistoricoChart(){
  const canvas = document.getElementById('histChart');
  if(!canvas) return;
  const fromStr = window._histFrom || todayISO();
  const toStr = window._histTo || todayISO();
  const sales = salesInPeriod(fromStr, toStr).filter(s=>!s.cancelled);
  const multiDay = fromStr !== toStr;

  // ajusta resolução do canvas ao tamanho real exibido
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 150;
  canvas.width = w*ratio; canvas.height = h*ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.clearRect(0,0,w,h);

  const padBottom = 18, padTop = 8;
  const chartH = h - padBottom - padTop;
  const barGap = 2;

  let buckets = []; // [{label, value}]
  if(!multiDay){
    // agrupa por hora do dia único
    const hourly = new Array(24).fill(0);
    sales.forEach(s=>{ hourly[new Date(s.date).getHours()] += s.total; });
    let firstHour = 6, lastHour = 22;
    hourly.forEach((v,i)=>{ if(v>0){ firstHour = Math.min(firstHour,i); lastHour = Math.max(lastHour,i);} });
    for(let i=firstHour;i<=lastHour;i++) buckets.push({label:i+'h', value:hourly[i]});
  } else {
    // agrupa por dia do período
    const byDay = {};
    sales.forEach(s=>{ const d = saleDateISO(s); byDay[d] = (byDay[d]||0) + s.total; });
    let cur = new Date(fromStr+'T00:00:00');
    const end = new Date(toStr+'T00:00:00');
    while(cur<=end){
      const iso = localDateISO(cur);
      buckets.push({label: cur.getDate()+'/'+(cur.getMonth()+1), value: byDay[iso]||0});
      cur.setDate(cur.getDate()+1);
    }
    // limita a no máximo ~31 barras para não espremer demais (já é o range máximo comum)
  }
  if(!buckets.length) buckets = [{label:'', value:0}];

  const maxVal = Math.max(...buckets.map(b=>b.value), 1);
  const bw = (w / buckets.length) - barGap;
  const labelEvery = buckets.length > 15 ? Math.ceil(buckets.length/10) : (buckets.length>8?2:1);

  buckets.forEach((b, idx)=>{
    const barH = maxVal>0 ? (b.value/maxVal)*chartH : 0;
    const x = idx*(bw+barGap);
    const y = padTop + (chartH - barH);
    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#8A6D46';
    ctx.fillStyle = b.value>0 ? themeColor : '#E8DFCD';
    ctx.beginPath();
    const r = 3;
    ctx.moveTo(x, y+barH);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.lineTo(x+bw-r, y);
    ctx.arcTo(x+bw, y, x+bw, y+r, r);
    ctx.lineTo(x+bw, y+barH);
    ctx.closePath();
    ctx.fill();

    if(idx % labelEvery === 0){
      ctx.fillStyle = '#6B7785';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, x+bw/2, h-5);
    }
  });
}

/* ---- Cancelamento de venda (devolve tudo ao estoque) ---- */
function confirmCancelSale(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale || sale.cancelled) return;
  showModal(`
    <h3>Cancelar venda</h3>
    <p class="small muted">Essa venda será marcada como cancelada, os itens voltarão automaticamente para o estoque e o valor sairá dos totais do caixa.</p>
    <div class="card">
      <div class="small">${escapeHtml(summarizeItems(sale.items))}</div>
      <div style="font-weight:800;margin-top:6px;">${fmt(sale.total)} · ${sale.payment}</div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Voltar</button>
      <button class="btn btn-danger" onclick='executeCancelSale(${JSON.stringify(saleId)})'>Confirmar cancelamento</button>
    </div>
  `);
}
async function executeCancelSale(saleId){
  let found = true;
  let ok;
  if(!appIsOnline && fbAvailable){
    found = applyCancelMutation(state, saleId);
    if(found) await saveState();
    ok = false; // não tentado com o servidor agora — evita travar a tela esperando
  } else {
    ok = await runStateTransaction((s)=>{ found = applyCancelMutation(s, saleId); });
  }
  if(found && !ok && fbAvailable){
    const pendingOps = getPendingOfflineOps();
    const queuedSale = pendingOps.find(e=> e.deviceId===DEVICE_ID && e.type==='sale' && e.payload.id===saleId);
    if(queuedSale){
      // essa venda nem chegou a sair daqui (ainda estava só na fila local) —
      // cancelar é só tirar ela da fila, sem sentido avisar o servidor de uma
      // venda que ele nunca chegou a saber que existiu
      removePendingOfflineOp(queuedSale.id);
      const qtyByProduct = {};
      queuedSale.payload.items.forEach(it=> qtyByProduct[it.productId]=(qtyByProduct[it.productId]||0)+it.qty);
      Object.entries(qtyByProduct).forEach(([pid,qty])=> consumeOfflineReserve(pid, -qty));
    } else {
      queueOfflineOp('cancel', { saleId });
    }
  }
  closeModal();
  if(!found) alert('Essa venda já estava cancelada (talvez por outro aparelho).');
}

/* ---- Aba dedicada de Troca: busca por número de ticket, e escolhe o(s)
   produto(s) novo(s) na mesma grade usada na tela de Venda. ---- */
function findTicketOwnerIn(stateObj, ticketNum){
  for(const sale of stateObj.sales){
    if(sale.cancelled) continue;
    for(let i=0; i<sale.items.length; i++){
      const it = sale.items[i];
      if(!it.ticketStart) continue;
      const start = it.ticketStart, end = start + it.qty - 1;
      if(ticketNum>=start && ticketNum<=end) return { sale, itemIndex:i };
    }
  }
  return null;
}
function findTicketOwner(ticketNum){ return findTicketOwnerIn(state, ticketNum); }
function renderTroca(){
  const t = window._troca || (window._troca = { ticketNum:null, sale:null, itemIndex:null, cart:[] });

  if(!t.sale){
    return `
      <div class="card" style="text-align:center;padding:24px 14px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:10px;">Trocar item vendido</div>

        <button class="btn btn-primary" style="margin-top:14px;" onclick="buscarTicketTroca()">Buscar</button>
      </div>
    `;
  }

  const item = t.sale.items[t.itemIndex];
  if(!item){
    // o item pode ter sido alterado por outra troca depois dessa busca
    return `<div class="empty">Este item não está mais disponível para troca.<br><button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="resetTroca()">Buscar outro ticket</button></div>`;

  const creditValue = item.price; // valor de 1 unidade devolvida

  const q = (window._trocaSearchQ||'').toLowerCase();
  const isAvailable = p => p.alwaysAvailable || p.stock === null || p.stock === undefined || p.stock > 0;
  const list = state.products.filter(p=> isAvailable(p) && (!q || p.name.toLowerCase().includes(q) || (p.barcode||'').includes(q)));
  const tileHtml = p => `
    <button class="prod-tile" onclick="addToTrocaCart('${p.id}')">

        <div class="pprice">${fmt(p.price)}</div>
        <div class="pstock">${stockLabel(p)}</div>
      </div>
    </button>`;

  const newItemsTotal = t.cart.reduce((a,c)=>a+c.price*c.qty,0);
  const diff = newItemsTotal - creditValue;

  return `
    <div class="card">
      <div class="row">
        <div>
          <div class="small muted">Devolvendo · Ticket Nº ${t.ticketNum}</div>
          <div style="font-weight:700;">${escapeHtml(item.name)}</div>

      </div>

    <input id="trocaSearchBox" placeholder="🔍 Buscar produto..." value="${window._trocaSearchQ||''}" oninput="window._trocaSearchQ=this.value; render();" style="margin-bottom:12px;">
    <div class="prod-grid">${list.length ? list.map(tileHtml).join('') : '<div class="empty">Nenhum produto disponível.</div>'}</div>

    ${t.cart.length ? `
    <h2 class="section-title">Itens escolhidos na troca</h2>
    <div class="card">
      ${t.cart.map((c,i)=>`
        <div class="cart-item">
          <div><div class="ci-name">${escapeHtml(c.name)}</div><div class="ci-price">${fmt(c.price)} cada</div></div>
          <div class="qty-ctrl">
            <button onclick="changeTrocaQty(${i},-1)">−</button><span>${c.qty}</span><button onclick="changeTrocaQty(${i},1)">+</button>
          </div>
          <div style="font-weight:700;min-width:64px;text-align:right;">${fmt(c.price*c.qty)}</div>
          <button class="icon-btn" onclick="removeTrocaCartItem(${i})">✕</button>
        </div>`).join('')}
    </div>` : ''}

    <div class="card">
      <div class="row"><span class="muted small">Valor devolvido (crédito)</span><span style="font-weight:700;">${fmt(creditValue)}</span></div>

      <div class="row" style="border-top:1px solid var(--border); padding-top:8px; margin-top:8px;">
        <span class="muted small">${diff>0.004?'Diferença a cobrar':diff<-0.004?'Diferença a devolver':'Sem diferença'}</span>
        <span style="font-weight:800; color:${diff>0.004?'var(--danger)':diff<-0.004?'var(--success)':'var(--text)'};">${fmt(Math.abs(diff))}</span>

    </div>

    <button class="btn btn-primary" style="margin-top:10px;" onclick="finalizeTroca()">Finalizar troca</button>
  `;

function buscarTicketTroca(){
  const num = parseInt(document.getElementById('trocaTicketInput').value);
  const err = document.getElementById('trocaTicketError');
  if(!num){ err.textContent = 'Digite um número de ticket válido.'; err.style.display='block'; return; }
  const found = findTicketOwner(num);
  if(!found){ err.textContent = 'Nenhum item encontrado com esse número de ticket.'; err.style.display='block'; return; }
  window._troca = { ticketNum:num, sale:found.sale, itemIndex:found.itemIndex, cart:[] };
  window._trocaSearchQ = '';
  render();
}
function resetTroca(){
  window._troca = { ticketNum:null, sale:null, itemIndex:null, cart:[] };
  window._trocaSearchQ = '';
  render();
}
function addToTrocaCart(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p) return;
  const existing = window._troca.cart.find(c=>c.productId===pid);
  const max = maxQtyForProduct(p);
  if((existing?existing.qty:0) >= max){
    if(!appIsOnline) alert('Sua reserva offline pra este produto já foi totalmente usada.');
    return;
  }
  if(existing) existing.qty++;
  else window._troca.cart.push({ productId:pid, name:p.name, price:p.price, qty:1 });
  render();
}
function changeTrocaQty(i, delta){
  const c = window._troca.cart[i];
  c.qty += delta;
  if(c.qty<=0) window._troca.cart.splice(i,1);
  render();
}
function removeTrocaCartItem(i){
  window._troca.cart.splice(i,1);
  render();
}
async function finalizeTroca(){
  const t = window._troca;
  if(!t || !t.sale) return;
  const ticketNum = t.ticketNum;
  const cartSnapshot = t.cart.map(c=>({...c}));

  let txResult, ok;
  if(!appIsOnline && fbAvailable){
    // Já sabemos que está offline: aplica direto aqui (o limite dos itens
    // novos já foi garantido em addToTrocaCart) e marca pra reaplicar quando
    // a conexão voltar, em vez de esperar o servidor sem necessidade.
    txResult = applyTrocaMutation(state, ticketNum, cartSnapshot);
    if(!txResult.notFound) await saveState();
    ok = false;
  } else {
    ok = await runStateTransaction((s)=>{ txResult = applyTrocaMutation(s, ticketNum, cartSnapshot); });
  }

  if(!txResult || txResult.notFound){
    alert('Este ticket não está mais disponível (pode já ter sido alterado em outro aparelho). Busque de novo.');
    resetTroca();
    return;
  }
  if(!ok && fbAvailable){
    cartSnapshot.forEach(c=> consumeOfflineReserve(c.productId, c.qty));
    queueOfflineOp('troca', { ticketNum, cartSnapshot });
  }

  const diff = txResult.diff;
  const dateStr = new Date().toLocaleString('pt-BR');
  window._lastTrocaTicketText = txResult.printableNewItems.length ? buildTrocaStubsText(txResult.printableNewItems, dateStr) : null;
  const diffMsg = Math.abs(diff)<0.01 ? 'Sem diferença de valor.' :
    (diff>0 ? `Diferença a cobrar do cliente: ${fmt(diff)}` : `Diferença a devolver ao cliente: ${fmt(Math.abs(diff))}`);
  resetTroca();
  showModal(`
    <h3>Troca realizada ✅</h3>
    <p>${diffMsg}</p>
    ${diff>0 ? `<p class="small muted">Não esqueça de receber essa diferença do cliente.</p>` : (diff<0 ? `<p class="small muted">Não esqueça de devolver essa diferença ao cliente.</p>` : '')}
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-outline" onclick="closeModal()">Fechar</button>
      ${window._lastTrocaTicketText ? `<button class="btn btn-primary" onclick="printTrocaTicket()">🖨️ Imprimir novo ticket</button>` : ''}
    </div>
  `);
}
function printTrocaTicket(){
  if(!window._lastTrocaTicketText) return;
  triggerPrint(window._lastTrocaTicketText);
}
function buildTrocaStubsText(items, dateStr){
  const c = state.config;
  const W = paperCharsWidth();
  const { boxTop, boxBottom, boxDivider, boxBlank, boxText, dottedSeparator } = makeBoxHelpers(W);
  let out = '';
  items.forEach(it=>{
    for(let unit=1; unit<=it.qty; unit++){
      const ticketNum = it.ticketStart + (unit-1);
      out += boxTop() + '\n';
      out += boxText(c.storeName||'Minha Loja') + '\n';
      out += boxText(dateStr) + '\n';
      out += boxDivider() + '\n';
      out += boxBlank() + '\n';
      out += boxText(it.name.toUpperCase()) + '\n';
      out += boxBlank() + '\n';
      out += boxText(fmt(it.price)) + '\n';
      out += boxBlank() + '\n';
      out += boxDivider() + '\n';
      out += boxText('Ticket Nº ' + ticketNum) + '\n';
      out += boxBottom() + '\n';
      out += dottedSeparator();
    }
  });
  return out;
}

function downloadBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `backup-pdv-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleRestoreFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('Esse arquivo não parece ser um backup válido.'); return; }
    if(!parsed.products || !parsed.sales || !parsed.users){
      alert('Esse arquivo não parece ser um backup válido do PDV Fácil.');
      return;
    }
    window._pendingRestore = parsed;
    showModal(`
      <h3 style="color:var(--danger);">⚠️ Restaurar backup</h3>
      <p class="small">Isso vai <b>substituir todos os dados atuais</b> (produtos, vendas, usuários) pelos do arquivo selecionado. Não tem como desfazer depois.</p>
      <label>Digite sua senha de administrador para confirmar</label>
      <input type="password" id="restoreAdminPass" placeholder="Sua senha">
      <label class="pwd-toggle"><input type="checkbox" onchange="togglePasswordVisibility(this,'restoreAdminPass')"> Mostrar senha</label>
      <div id="restoreError" class="small" style="color:var(--danger); margin-top:6px; display:none;"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="confirmRestoreBackup()">Restaurar</button>
      </div>
    `);
  };
  reader.readAsText(file);
  evt.target.value = ''; // permite escolher o mesmo arquivo de novo depois, se precisar
}
async function confirmRestoreBackup(){
  const pass = document.getElementById('restoreAdminPass').value;
  const err = document.getElementById('restoreError');
  if(!currentUser){ closeModal(); return; }
  const valid = await verifyCurrentUserPassword(pass);
  if(!valid){
    err.textContent = 'Senha incorreta.';
    err.style.display = 'block';
    return;
  }
  state = window._pendingRestore;
  window._pendingRestore = null;
  const ok = await saveState();
  closeModal();
  render();
  if(ok) alert('Backup restaurado com sucesso!');
}
async function clearSalesHistory(){
  const from = document.getElementById('clr_from').value;
  const to = document.getElementById('clr_to').value;
  if(!from || !to){ alert('Selecione as duas datas (De e Até).'); return; }
  if(from>to){ alert('A data "De" não pode ser depois da data "Até".'); return; }
  const alsoCash = document.getElementById('clr_alsoCash').checked;
  const count = state.sales.filter(s=> saleDateISO(s)>=from && saleDateISO(s)<=to).length;
  if(count===0){ alert('Nenhuma venda encontrada nesse período.'); return; }
  if(!confirm(`Isso vai apagar ${count} venda(s) registradas entre ${from} e ${to}. Essa ação não pode ser desfeita. Continuar?`)) return;
  state.sales = state.sales.filter(s=> !(saleDateISO(s)>=from && saleDateISO(s)<=to));
  if(alsoCash){
    state.cashSessions = state.cashSessions.filter(cs=>{
      const d = cs.closedAt ? cs.closedAt.slice(0,10) : null;
      return !(d && d>=from && d<=to);
    });
  }
  const ok = await saveState();
  render();
  if(ok) alert('Histórico do período apagado com sucesso.');
}
async function clearAllSalesHistory(){
  if(!confirm('Isso vai apagar TODO o histórico de vendas e fechamentos de caixa, zerando o sistema para começar a operar de verdade. Produtos e usuários cadastrados NÃO serão apagados. Continuar?')) return;
  if(!confirm('Tem certeza mesmo? Essa ação não pode ser desfeita.')) return;
  state.sales = [];
  state.cashSessions = [];
  const ok = await saveState();
  render();
  if(ok) alert('Histórico de vendas zerado. O sistema está pronto para começar a operar de verdade.');
}
function renderLocalUsersList(){
  return state.users.map(u=>`
    <div class="row" style="padding:10px 0; border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:700;">${escapeHtml(u.username)} ${currentUser && u.id===currentUser.id?'<span class="small muted">(você)</span>':''}</div>
        <span class="badge ${u.role==='admin'?'green':'orange'}">${u.role==='admin'?'Administrador':'Usuário comum'}</span>
      </div>
      ${(!currentUser || u.id!==currentUser.id) ? `<button class="icon-btn" onclick='deleteLocalUser(${JSON.stringify(u.id)})'>🗑️</button>` : ''}
    </div>`).join('');
}
function renderFirebaseUsersList(){
  const list = window._fbUserList || [];
  if(!list.length) return `<div class="small muted">Carregando usuários...</div>`;
  return list.map(u=>`
    <div class="row" style="padding:10px 0; border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:700;">${escapeHtml(u.email)} ${currentUser && u.id===currentUser.id?'<span class="small muted">(você)</span>':''}</div>
        <span class="badge ${u.role==='admin'?'green':'orange'}">${u.role==='admin'?'Administrador':'Usuário comum'}</span>
      </div>
      ${(!currentUser || u.id!==currentUser.id) ? `<button class="icon-btn" onclick='removeFirebaseUser(${JSON.stringify(u.id)})'>🗑️</button>` : ''}
    </div>`).join('');
}
async function loadFirebaseUserList(){
  if(!fbAvailable) return;
  try{
    const snap = await withTimeout(fbDb.collection('pdv_users').get(), 6000);
    window._fbUserList = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  }catch(e){ console.error('Não foi possível carregar a lista de usuários', e); }
  if(activeTab==='config') render();
}
function openUserForm(){
  if(fbAvailable) return openFirebaseUserForm();
  return openLocalUserForm();
}
function openFirebaseUserForm(){
  showModal(`
    <h3>Novo usuário</h3>
    <label>E-mail</label>
    <input id="nu_email" type="email" autocomplete="off">
    <label>Senha</label>
    <input id="nu_pass" type="password" placeholder="mínimo 6 caracteres">
    <label>Confirmar senha</label>
    <input id="nu_pass2" type="password">
    <label class="pwd-toggle"><input type="checkbox" onchange="togglePasswordVisibility(this,'nu_pass','nu_pass2')"> Mostrar senha</label>
    <label>Tipo de acesso</label>
    <select id="nu_role">
      <option value="comum">Usuário comum (sem acesso à Configuração)</option>
      <option value="admin">Administrador (acesso total)</option>
    </select>
    <div id="nuError" class="small" style="color:var(--danger); margin-top:6px;"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveFirebaseNewUser()">Criar usuário</button>
    </div>
  `);
}
async function saveFirebaseNewUser(){
  const email = document.getElementById('nu_email').value.trim();
  const pass = document.getElementById('nu_pass').value;
  const pass2 = document.getElementById('nu_pass2').value;
  const role = document.getElementById('nu_role').value;
  const err = document.getElementById('nuError');
  if(!email || pass.length<6){ err.textContent = 'Preencha o e-mail e uma senha com pelo menos 6 caracteres.'; err.style.display='block'; return; }
  if(pass!==pass2){ err.textContent = 'As senhas não coincidem.'; err.style.display='block'; return; }
  try{
    // usa uma instância secundária do Firebase, só pra criar essa conta —
    // assim o administrador que está criando o usuário não é deslogado
    const secondaryApp = firebase.apps.find(a=>a.name==='Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
    const secAuth = secondaryApp.auth();
    const cred = await secAuth.createUserWithEmailAndPassword(email, pass);
    await fbDb.collection('pdv_users').doc(cred.user.uid).set({ email, role, createdAt: Date.now() });
    await secAuth.signOut();
    closeModal();
    await loadFirebaseUserList();
    alert('Usuário criado com sucesso!');
  }catch(e){
    err.textContent = translateFirebaseAuthError(e);
    err.style.display = 'block';
  }
}
async function removeFirebaseUser(userId){
  const list = window._fbUserList || [];
  const target = list.find(u=>u.id===userId);
  if(!target) return;
  const remainingAdmins = list.filter(u=>u.role==='admin' && u.id!==userId).length;
  if(target.role==='admin' && remainingAdmins===0){
    alert('Não é possível remover o único administrador. Crie outro administrador antes de remover este.');
    return;
  }
  if(!confirm(`Remover o acesso de "${target.email}"? (a conta de login dele continua existindo, mas ele não vai mais conseguir entrar no app)`)) return;
  try{
    await fbDb.collection('pdv_users').doc(userId).delete();
    await loadFirebaseUserList();
  }catch(e){
    alert('Não foi possível remover: ' + e.message);
  }
}
function openLocalUserForm(){
  showModal(`
    <h3>Novo usuário</h3>
    <label>Usuário</label>
    <input id="nu_username" autocomplete="off" placeholder="ex: caixa1">
    <label>Senha</label>
    <input id="nu_pass" type="password" placeholder="mínimo 4 caracteres">
    <label>Confirmar senha</label>
    <input id="nu_pass2" type="password">
    <label class="pwd-toggle"><input type="checkbox" onchange="togglePasswordVisibility(this,'nu_pass','nu_pass2')"> Mostrar senha</label>
    <label>Tipo de acesso</label>
    <select id="nu_role">
      <option value="comum">Usuário comum (sem acesso à Configuração)</option>
      <option value="admin">Administrador (acesso total)</option>
    </select>
    <div id="nuError" class="small" style="color:var(--danger); margin-top:6px;"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveLocalNewUser()">Criar usuário</button>
    </div>
  `);
}
async function saveLocalNewUser(){
  const username = document.getElementById('nu_username').value.trim();
  const pass = document.getElementById('nu_pass').value;
  const pass2 = document.getElementById('nu_pass2').value;
  const role = document.getElementById('nu_role').value;
  const err = document.getElementById('nuError');
  if(!username || pass.length<4){ err.textContent = 'Preencha o usuário e uma senha com pelo menos 4 caracteres.'; return; }
  if(pass!==pass2){ err.textContent = 'As senhas não coincidem.'; return; }
  if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ err.textContent = 'Já existe um usuário com esse nome.'; return; }
  const passwordHash = await hashPw(pass);
  state.users.push({ id: uid(), username, passwordHash, role });
  const ok = await saveState();
  closeModal();
  render();
  if(ok) alert('Usuário criado com sucesso!');
}
async function deleteLocalUser(userId){
  const target = state.users.find(u=>u.id===userId);
  if(!target) return;
  const remainingAdmins = state.users.filter(u=>u.role==='admin' && u.id!==userId).length;
  if(target.role==='admin' && remainingAdmins===0){
    alert('Não é possível excluir o único administrador. Crie outro administrador antes de excluir este.');
    return;
  }
  if(!confirm(`Excluir o usuário "${target.username}"?`)) return;
  state.users = state.users.filter(u=>u.id!==userId);
  await saveState();
  render();
}
function onPrintMethodChange(value){
  localSettings.printMethod = value;
  saveLocalSettings();
  document.getElementById('rawbtHint').style.display = value==='rawbt' ? 'block' : 'none';
  document.getElementById('qzHint').style.display = value==='qz' ? 'block' : 'none';
  document.getElementById('shareHint').style.display = value==='share' ? 'block' : 'none';
}
async function saveConfig(){
  state.config = {
    ...state.config,
    storeName: document.getElementById('c_name').value.trim() || 'Minha Loja',
    address: document.getElementById('c_address').value.trim(),
    cnpj: document.getElementById('c_cnpj').value.trim(),
    phone: document.getElementById('c_phone').value.trim(),
    footer: document.getElementById('c_footer').value.trim(),
    printerWidth: document.getElementById('c_printerWidth').value,
  };
  const ok = await saveState();
  syncPublicBranding();
  render();
  if(ok) alert('Configurações salvas!');
}
/* ---- Fotos laterais da tela de login ----
   O fundo (branco, cinza-claro, quadriculado etc.) é removido
   automaticamente ao enviar a foto, deixando só a imagem "recortada" —
   assim ela fica flutuando sobre a cor do app, sem caixa nem fundo visível.
   O tamanho de exibição continua sempre o mesmo (ver CSS .auth-side-photo),
   não importa a proporção da foto original. */
async function handleLoginPhotoSelect(evt, key){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await processCutoutPhoto(file, 640);
    state.config[key] = dataUrl;
    const ok = await saveState();
    syncPublicBranding();
    render();
    if(!ok) alert('⚠️ Não foi possível salvar a foto (armazenamento cheio). Tente uma imagem menor.');
  }catch(e){
    alert('Não foi possível carregar essa imagem.');
  }
}
async function removeLoginPhoto(key){
  state.config[key] = null;
  await saveState();
  syncPublicBranding();
  render();
}
function wipeData(){
  showModal(`
    <h3 style="color:var(--danger);">⚠️ Apagar todos os dados</h3>
    <p class="small">Isso vai apagar <b>PERMANENTEMENTE</b> todos os produtos, vendas e histórico de caixa cadastrados no sistema. Não tem como desfazer essa ação depois de confirmada.</p>
    <p class="small muted">Os usuários cadastrados não serão apagados.</p>
    <label>Digite sua senha de administrador para confirmar</label>
    <input type="password" id="wipeAdminPass" placeholder="Sua senha">
    <label class="pwd-toggle"><input type="checkbox" onchange="togglePasswordVisibility(this,'wipeAdminPass')"> Mostrar senha</label>
    <div id="wipeError" class="small" style="color:var(--danger); margin-top:6px; display:none;">Senha incorreta.</div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmWipeData()">Apagar tudo</button>
    </div>
  `);
}
async function confirmWipeData(){
  const pass = document.getElementById('wipeAdminPass').value;
  const err = document.getElementById('wipeError');
  if(!currentUser){ closeModal(); return; }
  const valid = await verifyCurrentUserPassword(pass);
  if(!valid){
    err.style.display = 'block';
    return;
  }
  state = { products:[], sales:[], cashSessions:[], cash:{isOpen:false,openedAt:null,openingAmount:0,movements:[]}, config: state.config, users: state.users || [] };
  cart = [];
  await saveState();
  closeModal();
  render();
  alert('Todos os dados foram apagados. O sistema está pronto para começar do zero.');
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

============================================================ */
loadState();
