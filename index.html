<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PDV Fácil</title>
<style>
  :root{
    --bg:#F7F1E7;
    --surface:#FFFFFF;
    --primary:#8A6D46;
    --primary-dark:#6B5236;
    --primary-light:#F0E6D2;
    --accent:#C97C3D;
    --danger:#E5484D;
    --danger-light:#FDEBEB;
    --success:#A88D4A;
    --text:#2B2620;
    --muted:#8A7F6E;
    --border:#E8DFCD;
    --radius:14px;
    --nav-h:70px;
    --bar-h:56px;
    --app-w:460px; /* largura do app — aumenta em telas maiores via media queries abaixo */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
  }
  #phone{
    width:100%; max-width:var(--app-w); min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative;
  }
  /* ---------- App bar ---------- */
  #appbar{
    height:var(--bar-h); background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; position:sticky; top:0; z-index:20;
  }
  #appbar .title{font-size:17px; font-weight:700; letter-spacing:.2px;}
  #appbar .status{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:rgba(255,255,255,.15); display:flex; align-items:center; gap:6px;
  }
  #appbar .status .dot{width:7px;height:7px;border-radius:50%;background:#8FE3C5;}
  #appbar .status.closed .dot{background:#FFB4A6;}
  #appbar .status.closed{background:rgba(255,107,74,.25);}

  /* ---------- Reserva de estoque offline ---------- */
  #offlineBanner{
    display:none; align-items:center; gap:8px; padding:8px 14px;
    background:var(--danger-light); color:var(--danger); font-size:12px; font-weight:700;
    border-bottom:1px solid rgba(229,72,77,.2);
  }
  #offlineBanner.show{display:flex;}
  #offlineBanner .dot{width:7px;height:7px;border-radius:50%;background:var(--danger); flex:none; animation:offlinePulse 1.4s infinite;}
  @keyframes offlinePulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .reserve-note{font-size:11px; font-weight:700; color:var(--danger);}
  .pwd-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:6px 0 0; cursor:pointer; user-select:none;}
  .pwd-toggle input{margin:0; width:auto;}

  /* ---------- Views ---------- */
  #view{flex:1; padding:14px 14px calc(var(--nav-h) + 20px); overflow-y:auto;}
  h2.section-title{font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 2px 10px; font-weight:700;}
  h2.section-title:first-child{margin-top:0;}

  .card{background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:10px; border:1px solid var(--border);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}

  /* ---------- Buttons ---------- */
  button{font-family:inherit; cursor:pointer;}
  .btn{
    border:none; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-outline{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
  .btn-danger{background:var(--danger-light); color:var(--danger);}
  .btn-ghost{background:var(--primary-light); color:var(--primary-dark);}
  .btn-sm{padding:8px 12px; font-size:13px; width:auto;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}

  /* ---------- Inputs ---------- */
  label{font-size:12px; font-weight:700; color:var(--muted); display:block; margin:10px 2px 5px;}
  input, select, textarea{
    width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--border);
    font-size:15px; background:#fff; color:var(--text); font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary);}

  /* ---------- Bottom nav ---------- */
  #bottomnav{
    height:var(--nav-h); background:#fff; border-top:1px solid var(--border);
    display:flex; position:fixed; bottom:0; width:100%; max-width:var(--app-w); z-index:20;
  }
  .navbtn{
    flex:1; border:none; background:transparent; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:11px; font-weight:600;
  }
  .navbtn .icon-wrap{
    width:32px; height:32px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:var(--chip-bg); transition:background .15s;
  }
  .navbtn svg{width:18px; height:18px; stroke:var(--chip-color); transition:stroke .15s;}
  .navbtn.active{color:var(--chip-color);}
  .navbtn.active .icon-wrap{background:var(--chip-color);}
  .navbtn.active svg{stroke:#fff;}
  .navbtn[data-tab="venda"]{--chip-color:#16a34a; --chip-bg:#dcfce7;}
  .navbtn[data-tab="produtos"]{--chip-color:#2563eb; --chip-bg:#dbeafe;}
  .navbtn[data-tab="caixa"]{--chip-color:#d97706; --chip-bg:#fef3c7;}
  .navbtn[data-tab="troca"]{--chip-color:#7c3aed; --chip-bg:#ede9fe;}
  .navbtn[data-tab="historico"]{--chip-color:#0891b2; --chip-bg:#cffafe;}
  .navbtn[data-tab="config"]{--chip-color:#e11d48; --chip-bg:#ffe4e6;}

  /* ---------- Product grid (Venda) ---------- */
  #searchBox{margin-bottom:10px;}
  .cat-chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .cat-chips::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0; border:1.5px solid var(--border); background:#fff; color:var(--text);
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; white-space:nowrap;
  }
  .cat-chip.selected{background:var(--primary); border-color:var(--primary); color:#fff;}

  .theme-swatch-grid{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .theme-swatch{
    width:10mm; height:10mm; flex-shrink:0; border-radius:50%; border:2px solid transparent; position:relative;
    overflow:hidden; padding:0; margin:0; box-sizing:border-box; vertical-align:middle;
  }
  .theme-swatch.selected{border-color:var(--text); box-shadow:0 0 0 2px #fff inset;}
  .theme-swatch.selected::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .theme-swatch-custom{
    display:flex; align-items:center; justify-content:center;
    background-image:conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }
  .prod-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;}
  .prod-tile{
    background:#fff; border:1px solid var(--border); border-radius:12px; padding:0; overflow:hidden;
    text-align:left; display:flex; flex-direction:column; min-height:78px;
  }
  .prod-tile .ptext{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px;}
  .prod-photo{width:100%; aspect-ratio:1/1; object-fit:cover; object-position:center; display:block; background:var(--bg);}
  .prod-photo-placeholder{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:var(--primary-light); color:var(--primary); opacity:.55;
  }
  .prod-photo-placeholder svg{width:28px; height:28px;}
  .prod-tile:active{background:var(--primary-light);}
  .prod-tile .pname{font-weight:700; font-size:13.5px; line-height:1.25;}
  .prod-tile .pprice{color:var(--primary); font-weight:800; font-size:14px;}
  .prod-tile .pstock{font-size:11px; color:var(--muted);}
  .empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;}

  /* ---------- Upload de foto (cadastro) ---------- */
  .photo-upload{display:flex; align-items:center; gap:12px; margin-top:6px;}
  .photo-preview-box{
    width:72px; height:72px; border-radius:12px; overflow:hidden; flex-shrink:0;
    background:var(--primary-light); display:flex; align-items:center; justify-content:center; color:var(--primary);
    border:1px solid var(--border);
  }
  .photo-preview-box img{width:100%; height:100%; object-fit:cover;}
  .photo-preview-box svg{width:26px; height:26px; opacity:.6;}
  .photo-upload-actions{display:flex; flex-direction:column; gap:6px; flex:1;}
  .photo-upload-actions input[type=file]{display:none;}
  .photo-btn{
    border:1.5px solid var(--primary); color:var(--primary); background:#fff; border-radius:10px;
    padding:9px 12px; font-size:13px; font-weight:700; text-align:center;
  }
  .photo-remove-btn{border:none; background:transparent; color:var(--danger); font-size:12px; font-weight:700; padding:2px;}

  /* list item thumb (produtos cadastrados) */
  .prod-list-thumb{width:46px; height:46px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--bg);}
  .prod-list-thumb-placeholder{
    width:46px; height:46px; border-radius:10px; flex-shrink:0; background:var(--primary-light);
    display:flex; align-items:center; justify-content:center; color:var(--primary); opacity:.55;
  }
  .prod-list-thumb-placeholder svg{width:20px; height:20px;}

  .stock-adjust{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border);
  }
  .stock-adjust .icon-btn{width:30px; height:30px; font-size:16px; font-weight:700; flex-shrink:0;}
  .stock-input{
    width:56px; text-align:center; padding:6px 4px; font-weight:700; -moz-appearance:textfield;
  }
  .stock-input::-webkit-outer-spin-button, .stock-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }


  /* ---------- Cart drawer ---------- */
  #cartBar{
    position:fixed; bottom:var(--nav-h); width:100%; max-width:var(--app-w); background:var(--primary-dark);
    color:#fff; padding:12px 14px; display:none; align-items:center; justify-content:space-between;
    z-index:19; border-radius:14px 14px 0 0;
  }
  #cartBar.show{display:flex;}
  #cartBar .info{font-size:13px; opacity:.85;}
  #cartBar .total{font-size:18px; font-weight:800;}
  #cartBar button{background:#fff; color:var(--primary-dark); border:none; border-radius:10px; padding:10px 16px; font-weight:800; font-size:14px;}

  /* ---------- Cart list items ---------- */
  .cart-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .cart-item:last-child{border-bottom:none;}
  .cart-item .ci-name{flex:1; font-size:14px; font-weight:600;}
  .cart-item .ci-price{font-size:12px; color:var(--muted);}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:16px; font-weight:700; color:var(--primary);}
  .qty-ctrl span{min-width:18px; text-align:center; font-weight:700;}

  /* ---------- Modal ---------- */
  /* ---------- Autenticação ---------- */
  #authScreen{
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:var(--primary); padding:24px;
  }
  .auth-card{
    background:#fff; border-radius:20px; padding:28px 22px; width:100%; max-width:360px;
  }
  .auth-card h2{margin:0 0 4px; font-size:20px;}
  .auth-card p{margin:0 0 16px;}
  .auth-logo{width:56px; height:56px; border-radius:16px; background:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#fff;}
  .auth-logo svg{width:28px; height:28px;}

  /* Fotos laterais da tela de login — só aparecem em telas largas, onde
     sobra espaço vazio dos dois lados do card. O fundo da foto é removido
     automaticamente no envio (ver removeBackgroundToTransparent), então a
     imagem é exibida "recortada" (sem caixa/moldura), flutuando sobre a cor
     de fundo do app. object-fit:contain garante que nada da imagem seja
     cortado, mantendo sempre um envelope de tamanho consistente. */
  .auth-wrap{ width:100%; display:flex; justify-content:center; }
  .auth-side-photo{ display:none; }

  /* Celular: as duas fotos aparecem lado a lado, em tamanho reduzido, acima
     do card de login (em vez de escondidas como antes). O card continua
     centralizado normalmente logo abaixo. */
  @media (max-width:859px){
    #authScreen{ align-items:flex-start; overflow-y:auto; padding:20px 16px; }
    .auth-wrap{
      display:grid; grid-template-columns:1fr 1fr;
      grid-template-areas:"left right" "card card";
      gap:8px 14px; max-width:360px; margin:0 auto;
    }
    .auth-side-photo{ display:flex; }
    .auth-side-photo.auth-side-left{ grid-area:left; justify-content:flex-end; }
    .auth-side-photo.auth-side-right{ grid-area:right; justify-content:flex-start; }
    .auth-card{ grid-area:card; }
    .auth-side-photo img{
      display:block; width:96px; height:130px; object-fit:contain; object-position:bottom;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));
    }
  }

  @media (min-width:860px){
    .auth-wrap{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:32px; max-width:1200px; margin:0 auto; }
    .auth-side-photo{ display:flex; align-items:center; height:100%; }
    .auth-side-photo.auth-side-left{ justify-content:flex-end; }
    .auth-side-photo.auth-side-right{ justify-content:flex-start; }
    .auth-side-photo img{
      display:block; width:220px; height:340px; object-fit:contain; object-position:center;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,20,20,.5); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; width:100%; max-width:var(--app-w); border-radius:20px 20px 0 0;
    padding:18px 18px 26px; max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:17px;}
  .modal .close-x{position:absolute; right:22px; background:var(--bg); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--muted);}
  .modal-handle{width:40px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 14px;}

  /* payment method chips */
  .pay-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
  .pay-chip{
    border:1.5px solid var(--border); border-radius:12px; padding:14px 10px; text-align:center;
    font-weight:700; font-size:13.5px; background:#fff; color:var(--text);
  }
  .pay-chip.selected{border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark);}

  /* receipt */
  #receiptPaper{
    font-family:'Courier New', monospace; font-size:12.5px; background:#fff; padding:14px;
    border:1px dashed var(--border); border-radius:8px; white-space:pre-wrap; line-height:1.5;
  }

  table.simple{width:100%; border-collapse:collapse; font-size:13px;}
  table.simple td{padding:5px 0; border-bottom:1px solid var(--border);}
  table.simple tr:last-child td{border-bottom:none;}

  .swipe-item{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .icon-btn{background:var(--bg); border:none; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;}

  .badge{display:inline-block; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:99px;}
  .badge.green{background:var(--primary-light); color:var(--primary-dark);}
  .badge.red{background:var(--danger-light); color:var(--danger);}
  .badge.orange{background:#FFF1EC; color:var(--accent);}

  /* ---------- Histórico ---------- */
  .hist-summary{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px;}
  .hist-summary .card{padding:10px; text-align:center; margin-bottom:0;}
  .hist-summary .hs-label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase;}
  .hist-summary .hs-value{font-size:15px; font-weight:800; color:var(--primary); margin-top:2px;}
  #histChart{width:100%; height:150px; display:block;}
  #prodChart{width:100%; height:190px; display:block;}
  .sale-row{padding:12px 0; border-bottom:1px solid var(--border);}
  .sale-row:last-child{border-bottom:none;}
  .sale-row.cancelled{opacity:.55;}
  .sale-row .sr-items{font-size:12px; color:var(--muted); margin:2px 0 8px;}
  .sale-row .sr-top{display:flex; justify-content:space-between; align-items:center;}
  .sale-row .sr-time{font-weight:700; font-size:13.5px;}
  .sale-row .sr-total{font-weight:800; font-size:14.5px;}
  .sale-row.cancelled .sr-total{text-decoration:line-through;}

  /* print styles */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; left:0; top:0; font-family:'Courier New',monospace; font-size:11px; white-space:pre-wrap;}
  }
  #printArea{display:none;}

  /* ---------- Telas maiores (tablet / computador) ---------- */
  @media (min-width: 640px){
    :root{ --app-w: 680px; }
    .prod-grid{ grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
  }
  @media (min-width: 900px){
    :root{ --app-w: 960px; }
    body{ background:var(--bg); }
    #phone{ box-shadow:0 0 0 1px var(--border), 0 12px 40px rgba(16,32,32,.08); border-radius:0 0 18px 18px; }
    .prod-grid{ grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
    .hist-summary{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (min-width: 1280px){
    :root{ --app-w: 1180px; }
    .prod-grid{ grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); }
  }
</style>
</head>
<body>
<div id="phone">

  <div id="appbar">
    <div class="title" id="storeTitle">PDV Fácil</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="status closed" id="cashStatus"><span class="dot"></span><span id="cashStatusText">Caixa fechado</span></div>
      <button id="logoutBtn" onclick="confirmLogout()" title="Sair" style="background:rgba(255,255,255,.15); border:none; color:#fff; width:30px; height:30px; border-radius:8px; display:none; align-items:center; justify-content:center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div id="offlineBanner"><span class="dot"></span><span id="offlineBannerText">Sem conexão — vendendo com estoque reservado</span></div>

  <div id="view"></div>

  <div id="cartBar">
    <div>
      <div class="info" id="cartInfo">0 itens</div>
      <div class="total" id="cartTotal">R$ 0,00</div>
    </div>
    <button onclick="openCartReview()">Ver carrinho ▸</button>
  </div>

  <div id="bottomnav">
    <button class="navbtn" data-tab="venda" onclick="setTab('venda')">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
      Venda
    </button>
    <button class="navbtn" data-tab="produtos" onclick="setTab('produtos')">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg></span>
      Cadastro
    </button>
    <button class="navbtn" data-tab="caixa" onclick="setTab('caixa')">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="12" cy="15" r="1.5"/></svg></span>
      Caixa
    </button>
    <button class="navbtn" data-tab="troca" onclick="setTab('troca')">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
      Troca
    </button>
    <button class="navbtn" data-tab="historico" onclick="setTab('historico')">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg></span>
      Histórico
    </button>
    <button class="navbtn" data-tab="config" onclick="setTab('config')">

<script>
/* ============================================================
   FIREBASE (banco de dados compartilhado — sincroniza entre
   qualquer dispositivo que acessar o app online)
   Carregado em segundo plano, sem travar o app caso a internet
   esteja lenta, instável ou indisponível no momento.
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBIxL5q02DVW6SvIIwsknQ8PDxH21OVC0s",
  authDomain: "pdv-facil-fa2ff.firebaseapp.com",
  projectId: "pdv-facil-fa2ff",
  storageBucket: "pdv-facil-fa2ff.firebasestorage.app",
  messagingSenderId: "940660086113",
  appId: "1:940660086113:web:86ee0f3c7e2540c85f2120"
};
let fbDb = null, fbAvailable = false;
function loadScriptAsync(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Falha ao carregar '+src));
    document.head.appendChild(s);
  });
}
async function initFirebase(){
  try{
    await withTimeout(loadScriptAsync('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'), 4000);
    await withTimeout(loadScriptAsync('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'), 4000);
    await withTimeout(loadScriptAsync('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'), 4000);
    if(window.firebase){
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.firestore();
      fbAvailable = true;
    }

    console.error('Firebase indisponível no momento — o app vai funcionar normalmente usando os dados salvos neste aparelho.', e);
  }
}

/* ============================================================
   ESTADO
============================================================ */
let state = {
  products: [],
  sales: [],
  cashSessions: [], // histórico de sessões de caixa fechadas
  cash: { isOpen:false, openedAt:null, openingAmount:0, movements:[] }, // sessão atual
  config: { storeName:"Minha Loja", cnpj:"", address:"", phone:"", footer:"Obrigado pela preferência!", themeColor:"#8A6D46" },
  users: [] // {id, username, passwordHash, role: 'admin'|'comum'}
};
/* Configuração de impressão: fica SÓ neste aparelho (localStorage), nunca
   sincronizada pela nuvem. Cada celular/computador tem sua própria impressora
   conectada de um jeito diferente (QZ Tray só existe no computador que o tem
   instalado, RawBT só existe no Android daquele aparelho específico) — se
   isso fosse compartilhado, um aparelho ficaria tentando usar a configuração
   de impressão de outro aparelho e travando sem aviso. */
let localSettings = { printMethod: 'dialog', qzPrinterName: null };
function loadLocalSettings(){
  try{
    const raw = localStorage.getItem('pdv-local-settings');
    if(raw) localSettings = Object.assign(localSettings, JSON.parse(raw));
  }catch(e){ /* usa os padrões */ }
}
function saveLocalSettings(){
  try{ localStorage.setItem('pdv-local-settings', JSON.stringify(localSettings)); }catch(e){}
}
let currentUser = null; // sessão atual (não persiste — precisa logar de novo ao reabrir o app)
let userProfile = null; // perfil (role) vindo do Firestore, quando logado via Firebase Authentication
let cart = []; // {productId, name, price, qty}
let activeTab = 'venda';
let lastReceipt = null;

const fmt = v => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
/* Números de ticket começam em 20261 e nunca se repetem — mesmo que o
   contador salvo esteja mais baixo (ex: de testes antigos), o próximo
   número nunca fica abaixo desse início. */
const TICKET_START = 20260; // o primeiro ticket emitido será 20261
function nextTicketNumber(){
  const base = Math.max(state.ticketCounter || 0, TICKET_START);
  return base + 1;
}
/* Retorna a lista de pagamentos de uma venda: [{method, amount}, ...].
   Funciona tanto com vendas novas (pagamento dividido) quanto com vendas
   antigas, que só tinham uma forma de pagamento única (sale.payment). */
function salePayments(s){
  return (s.payments && s.payments.length) ? s.payments : [{ method: s.payment, amount: s.total }];
}
/* Lê o valor de um campo de dinheiro com segurança. Em muitos tablets/celulares
   Android, o teclado numérico digita vírgula como separador decimal, mas
   <input type="number"> só aceita ponto — isso fazia o campo "esvaziar"
   silenciosamente e o troco nunca calcular. Esta função aceita os dois. */
function readMoneyInput(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  const raw = (el.value||'').toString().trim().replace(',', '.');
  const v = parseFloat(raw);
  return isNaN(v) ? 0 : v;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* Camada de armazenamento: prioriza o Firestore (banco de dados compartilhado
   na nuvem — assim os dados aparecem em qualquer aparelho que acessar o app).
   Sempre também guarda uma cópia local (localStorage / window.storage), que
   funciona como cache offline e como plano B caso o Firestore não responda. */
/* Impede que qualquer promessa fique esperando resposta pra sempre (ex.: com
   internet lenta/instável) — depois de "ms" milissegundos, desiste e segue
   o fluxo normalmente usando os dados locais como reserva. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('tempo esgotado')), ms))
  ]);
}
let cloudFetchFailed = false; // true quando a nuvem está configurada mas não respondeu (rede instável, etc.)
async function storageGet(key){
  if(fbAvailable){
    try{
      const doc = await withTimeout(fbDb.collection('pdv').doc(key).get(), 4000);
      cloudFetchFailed = false;
      markOnline();
      if(doc.exists && doc.data().value){
        const val = doc.data().value;
        try{ localStorage.setItem(key, val); }catch(e){}
        return val;
      }
      return null; // documento realmente não existe na nuvem — banco vazio de verdade
    }catch(e){
      console.error('Firestore indisponível ou demorou demais — NÃO vou tratar isso como "banco vazio" pra não arriscar apagar dados reais.', e);
      cloudFetchFailed = true;
      markOffline();
      return undefined; // sinaliza "não sei", diferente de null ("sei que está vazio")
    }
  }
  if(window.storage){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ /* segue pro fallback abaixo */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(fbAvailable){
    try{
      await withTimeout(fbDb.collection('pdv').doc(key).set({ value, updatedAt: Date.now() }), 4000);
      ok = true;
      markOnline();
      saveDailyBackup(value); // best-effort, não bloqueia nem afeta o salvamento principal
    }catch(e){ console.error('Não foi possível salvar no Firestore (ou demorou demais)', e); markOffline(); }
  }
  try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* ignora */ }
  if(!ok && window.storage){
    try{ await window.storage.set(key, value, false); ok = true; }catch(e){}
  }
  return ok;
}
/* Backup automático: uma cópia por dia, guardada separada do documento
   principal. Se algo der errado com os dados de hoje, dá pra olhar o backup
   de ontem (ou de outro dia) e recuperar manualmente. Roda em segundo plano,
   sem travar nem interferir no salvamento normal. */
function saveDailyBackup(value){
  if(!fbAvailable) return;
  const dayKey = todayISO();
  fbDb.collection('pdv_backups').doc(dayKey).set({ value, savedAt: Date.now() })
    .catch(e=> console.error('Backup diário não pôde ser salvo (não afeta o salvamento principal)', e));
}
/* Escuta mudanças em tempo real no Firestore — assim, se você cadastrar algo
   em outro aparelho, este aqui atualiza sozinho, sem precisar recarregar. */
function watchRemoteChanges(){
  if(!fbAvailable) return;
  fbDb.collection('pdv').doc('pdv-state').onSnapshot(doc=>{
    if(!doc.exists) return;
    if(doc.metadata.hasPendingWrites) return; // ignora o eco da própria escrita local
    try{
      const remoteState = JSON.parse(doc.data().value);
      const defaultConfig = { ...state.config };
      state = remoteState;
      state.config = Object.assign({}, defaultConfig, remoteState.config || {});
      // só revalida contra state.users no modo de login local antigo — no
      // modo Firebase Authentication, os usuários vivem em outra coleção
      // (pdv_users), então isso não se aplica.
      if(currentUser && currentUser._authMode !== 'firebase'){
        const stillExists = state.users.find(u=>u.id===currentUser.id);
        currentUser = stillExists || null;
      }
      applyTheme(state.config.themeColor || '#8A6D46');
      render();
      renderAuthScreen();
    }catch(e){ console.error('Erro ao aplicar atualização remota', e); }
  }, err=> console.error('Erro na escuta em tempo real', err));
}
async function saveState(){
  const ok = await storageSet('pdv-state', JSON.stringify(state));
  if(!ok){
    alert('⚠️ Não foi possível salvar. O armazenamento do navegador está cheio — geralmente por causa de fotos de produtos muito pesadas ou muito numerosas. Tente remover a foto de algum produto ou usar fotos menores, e salve novamente.');
  }
  return ok;
}
/* Aplica uma mudança de forma segura contra uso simultâneo em vários
   aparelhos: busca a versão MAIS RECENTE direto do servidor (não a cópia
   local, que pode estar desatualizada), aplica a alteração em cima dela, e
   salva de volta — tudo de forma atômica (o Firestore garante isso via
   transação). Assim, se dois aparelhos mexerem em estoque/caixa quase ao
   mesmo tempo, nenhuma das duas mudanças se perde. */
async function runStateTransaction(mutatorFn){
  if(!fbAvailable){
    // sem nuvem disponível agora: aplica local e salva do jeito de sempre
    mutatorFn(state);
    await saveState();
    render();
    return true;
  }
  try{
    const docRef = fbDb.collection('pdv').doc('pdv-state');
    await withTimeout(fbDb.runTransaction(async (tx)=>{
      const doc = await tx.get(docRef);
      let freshState;
      try{ freshState = doc.exists ? JSON.parse(doc.data().value) : JSON.parse(JSON.stringify(state)); }
      catch(e){ freshState = JSON.parse(JSON.stringify(state)); }
      mutatorFn(freshState);
      tx.set(docRef, { value: JSON.stringify(freshState), updatedAt: Date.now() });
      state = freshState;
    }), 8000);
    try{ localStorage.setItem('pdv-state', JSON.stringify(state)); }catch(e){}
    saveDailyBackup(JSON.stringify(state));
    markOnline();
    render();
    return true;
  }catch(e){
    console.error('Não foi possível confirmar essa alteração de forma sincronizada com o servidor', e);
    markOffline();
    alert('⚠️ Não foi possível confirmar essa alteração com o servidor agora (conexão instável). Ela foi aplicada só neste aparelho — pode não estar sincronizada com os outros até a conexão melhorar.');
    mutatorFn(state);
    await saveState();
    render();
    return false;
  }
}

/* ============================================================
   RESERVA DE ESTOQUE OFFLINE
   ------------------------------------------------------------
   Objetivo: se a conexão cair com mais de um operador usando o
   app, ninguém deve vender mais do que a "fatia" de estoque que
   sobrou pra ele. Enquanto online, o app fica de olho em quantos
   operadores estão ativos (via um "sinal de presença" no
   Firestore) e recalcula, pra cada produto com controle de
   estoque, quanto CADA operador poderia vender com segurança se a
   conexão caísse agora (estoque total / nº de operadores ativos).

   No instante em que a conexão cai de verdade, essa última conta
   é "congelada" neste aparelho: a partir daí, o limite de venda de
   cada produto passa a ser essa cota (menos o que já foi vendido
   offline), em vez do estoque total — assim dois operadores
   offline ao mesmo tempo não conseguem vender a mesma unidade duas
   vezes. As vendas feitas nesse período ficam guardadas numa fila
   local e, quando a conexão volta, são reaplicadas uma a uma em
   cima do estoque mais atual do servidor (mesma transação seguraa
   já usada online), recalculando tudo de forma segura. Se ainda
   assim dois aparelhos conseguirem vender mais do que existia (ex.:
   um operador não estava com o app aberto pra contar na divisão), o
   estoque nunca fica negativo e a diferença é registrada em
   state.stockConflicts pra o admin revisar depois. */
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('pdv-device-id'); }catch(e){}
  if(!id){ id = uid(); try{ localStorage.setItem('pdv-device-id', id); }catch(e){} }
  return id;
}
const DEVICE_ID = getDeviceId();
let appIsOnline = (typeof navigator==='undefined' || navigator.onLine!==false);
let offlineReserve = {};       // { productId: quantidade reservada pra ESTE aparelho }
let offlineReserveMeta = { computedAt:null, operatorsCount:1 };
let offlineSoldSinceOffline = {}; // { productId: quantidade já vendida offline desde que a conexão caiu }
let presenceOperators = {};    // { deviceId: {name, lastSeen} } — snapshot dos operadores ativos
let presenceTimer = null, presenceUnsub = null;
const PRESENCE_TTL_MS = 40000; // considera "offline" quem não manda sinal há mais de 40s

try{
  const cachedReserve = JSON.parse(localStorage.getItem('pdv-offline-reserve') || 'null');
  if(cachedReserve){ offlineReserve = cachedReserve.reserve || {}; offlineReserveMeta = cachedReserve.meta || offlineReserveMeta; }
  const cachedSold = JSON.parse(localStorage.getItem('pdv-offline-sold') || 'null');
  if(cachedSold) offlineSoldSinceOffline = cachedSold;
}catch(e){}

function persistOfflineReserveCache(){
  try{ localStorage.setItem('pdv-offline-reserve', JSON.stringify({ reserve: offlineReserve, meta: offlineReserveMeta })); }catch(e){}
  try{ localStorage.setItem('pdv-offline-sold', JSON.stringify(offlineSoldSinceOffline)); }catch(e){}
}

function activeOperatorsCount(){
  const now = Date.now();
  const n = Object.values(presenceOperators).filter(p=> (now - p.lastSeen) < PRESENCE_TTL_MS).length;
  return Math.max(n, 1);
}

/* Enquanto online, mantém a "fatia" de cada produto sempre atualizada —
   assim, se a conexão cair de repente, já existe um número pronto pra usar. */
function recomputeOfflineReserve(){
  if(!appIsOnline || !fbAvailable) return;
  const n = activeOperatorsCount();
  const reserve = {};
  (state.products||[]).forEach(p=>{
    if(typeof p.stock === 'number') reserve[p.id] = Math.floor(Math.max(0,p.stock) / n);
  });
  offlineReserve = reserve;
  offlineReserveMeta = { computedAt: Date.now(), operatorsCount: n };
  offlineSoldSinceOffline = {}; // enquanto online não há "venda offline pendente"
  persistOfflineReserveCache();
  updateOfflineBanner();
}

function startPresenceHeartbeat(){
  if(!fbAvailable || presenceTimer) return;
  const beat = ()=>{
    if(!appIsOnline) return;
    fbDb.collection('pdv_presence').doc(DEVICE_ID).set({
      name: (currentUser && (currentUser.username || currentUser.name)) || 'Operador',
      lastSeen: Date.now()
    }).then(()=> markOnline()).catch(()=> markOffline());
  };
  beat();
  presenceTimer = setInterval(beat, 15000);
  if(!presenceUnsub){
    presenceUnsub = fbDb.collection('pdv_presence').onSnapshot(snap=>{
      const ops = {};
      snap.forEach(doc=> ops[doc.id] = doc.data());
      presenceOperators = ops;
      recomputeOfflineReserve();
    }, ()=>{});
  }
}
function stopPresenceHeartbeat(){
  if(presenceTimer){ clearInterval(presenceTimer); presenceTimer = null; }
  if(presenceUnsub){ presenceUnsub(); presenceUnsub = null; }
  if(fbAvailable && fbDb){ fbDb.collection('pdv_presence').doc(DEVICE_ID).delete().catch(()=>{}); }
}

/* Quantidade que ESTE aparelho ainda pode vender de um produto sem risco de
   conflito. Só entra em ação quando offline e já existe uma reserva calculada;
   fora disso, devolve null e quem chamou usa o estoque normal. */
function remainingOfflineReserve(productId){
  if(appIsOnline) return null;
  if(!offlineReserveMeta.computedAt) return null; // nunca chegou a calcular (ex.: nunca esteve online) — sem base pra limitar
  const reserved = offlineReserve[productId];
  if(typeof reserved !== 'number') return null;
  const sold = offlineSoldSinceOffline[productId] || 0;
  return Math.max(0, reserved - sold);
}
function consumeOfflineReserve(productId, qty){
  offlineSoldSinceOffline[productId] = (offlineSoldSinceOffline[productId]||0) + qty;
  persistOfflineReserveCache();
}

/* ---- Fila de operações feitas offline (venda, cancelamento, troca), pra
   reaplicar com segurança quando a conexão voltar ---- */
function getPendingOfflineOps(){
  try{ return JSON.parse(localStorage.getItem('pdv-pending-ops')||'[]'); }catch(e){ return []; }
}
function setPendingOfflineOps(list){
  try{ localStorage.setItem('pdv-pending-ops', JSON.stringify(list)); }catch(e){}
}
function queueOfflineOp(type, payload){
  const list = getPendingOfflineOps();
  list.push({ id: uid(), type, payload, deviceId: DEVICE_ID, queuedAt: Date.now() });
  setPendingOfflineOps(list);
}
function removePendingOfflineOp(opId){
  setPendingOfflineOps(getPendingOfflineOps().filter(e=>e.id!==opId));
}
function recordStockConflict(s, productName, deficit){
  if(!s.stockConflicts) s.stockConflicts = [];
  s.stockConflicts.push({ id: uid(), productName, deficit, date: Date.now(), deviceId: DEVICE_ID });
}
/* Aplica os efeitos de uma venda (numeração de ticket + baixa de estoque) num
   dado estado — usada tanto na hora da venda quanto ao reaplicar vendas que
   ficaram pendentes de quando o aparelho estava offline. */
function applySaleMutation(s, sale, opts){
  opts = opts || {};
  let nextTicket = Math.max(s.ticketCounter || 0, TICKET_START) + 1;
  sale.items.forEach(it=>{
    if(opts.reconciling && it.ticketStart) return; // já numerado da primeira vez, não renumera
    it.ticketStart = nextTicket;
    nextTicket += it.qty;
  });
  s.ticketCounter = Math.max(s.ticketCounter||0, nextTicket - 1);
  s.sales.push(sale);
  sale.items.forEach(it=>{
    const p = s.products.find(x=>x.id===it.productId);
    if(p && typeof p.stock==='number'){
      const deficit = it.qty - p.stock;
      if(opts.reconciling && deficit > 0) recordStockConflict(s, p.name, deficit);
      p.stock = Math.max(0, p.stock - it.qty);
    }
  });
}
/* Cancela uma venda (devolve o estoque, marca cancelada). Sempre seguro de
   reaplicar mais de uma vez: se já estava cancelada, não faz nada de novo. */
function applyCancelMutation(s, saleId){
  const sale = s.sales.find(x=>x.id===saleId);
  if(!sale || sale.cancelled) return false;
  sale.items.forEach(it=>{
    const p = s.products.find(x=>x.id===it.productId);
    if(p && typeof p.stock==='number') p.stock += it.qty;
  });
  sale.cancelled = true;
  sale.cancelledAt = new Date().toISOString();
  return true;
}
/* Troca um item de uma venda por outro(s), pelo número do ticket. Devolve
   {notFound} ou {notFound:false, diff, printableNewItems} — igual faça a
   troca na hora ou reaplicando depois de ter ficado offline. */
function applyTrocaMutation(s, ticketNum, cartSnapshot, opts){
  opts = opts || {};
  const found = findTicketOwnerIn(s, ticketNum);
  if(!found){
    // Ao reaplicar (reconciliando após ficar offline), "não achei o ticket"
    // pode significar que outro aparelho já trocou ou cancelou esse mesmo
    // ticket enquanto ambos estavam offline — registra pra o admin revisar,
    // em vez de simplesmente descartar essa troca em silêncio.
    if(opts.reconciling) recordStockConflict(s, `Troca do ticket ${ticketNum}`, 0);
    return { notFound:true };
  }
  const { sale, itemIndex } = found;
  const oldItem = sale.items[itemIndex];

  const oldProduct = s.products.find(p=>p.id===oldItem.productId);
  if(oldProduct && typeof oldProduct.stock==='number') oldProduct.stock += 1;
  const oldSubtotal = oldItem.price;
  const oldItemName = oldItem.name;
  oldItem.qty -= 1;
  if(oldItem.qty<=0) sale.items.splice(itemIndex,1);

  let nextTicket = Math.max(s.ticketCounter || 0, TICKET_START) + 1;
  const printableNewItems = [];
  cartSnapshot.forEach(c=>{
    const np = s.products.find(p=>p.id===c.productId);
    if(np && typeof np.stock==='number'){
      const deficit = c.qty - np.stock;
      if(opts.reconciling && deficit > 0) recordStockConflict(s, np.name, deficit);
      np.stock = Math.max(0, np.stock - c.qty);
    }
    sale.items.push({ productId:c.productId, name:c.name, price:c.price, qty:c.qty, ticketStart: nextTicket });
    printableNewItems.push({ name:c.name, price:c.price, qty:c.qty, ticketStart: nextTicket });
    nextTicket += c.qty;
  });
  s.ticketCounter = Math.max(s.ticketCounter||0, nextTicket - 1);

  const newItemsTotal = cartSnapshot.reduce((a,c)=>a+c.price*c.qty,0);
  const diff = newItemsTotal - oldSubtotal;

  sale.total = sale.items.reduce((a,it)=>a+it.price*it.qty,0);
  sale.exchanges = sale.exchanges || [];
  sale.exchanges.push({
    date: new Date().toISOString(),
    from: { name: oldItemName, qty:1, ticket: ticketNum },
    to: cartSnapshot.map(c=>({ name:c.name, qty:c.qty })),
    diff
  });

  return { notFound:false, diff, printableNewItems };
}
/* Reaplica, uma a uma, as operações feitas neste aparelho enquanto estava
   offline (vendas, cancelamentos, trocas) — cada uma em cima do estado MAIS
   ATUAL do servidor (a mesma transação segura usada quando online), pra
   recalcular o estoque real de forma correta assim que a conexão volta. */
let syncingOfflineOps = false;
async function syncPendingOfflineOps(){
  if(syncingOfflineOps || !fbAvailable || !appIsOnline) return;
  const pending = getPendingOfflineOps().filter(e=>e.deviceId===DEVICE_ID);
  if(!pending.length) return;
  syncingOfflineOps = true;
  try{
    for(const entry of pending){
      let ok;
      if(entry.type==='sale'){
        ok = await runStateTransaction(s=> applySaleMutation(s, entry.payload, {reconciling:true}));
      } else if(entry.type==='cancel'){
        ok = await runStateTransaction(s=> applyCancelMutation(s, entry.payload.saleId));
      } else if(entry.type==='troca'){
        ok = await runStateTransaction(s=> applyTrocaMutation(s, entry.payload.ticketNum, entry.payload.cartSnapshot, {reconciling:true}));
      } else { ok = true; } // tipo desconhecido: descarta em vez de travar a fila pra sempre
      if(!ok) break; // ainda sem conexão de verdade — tenta o resto depois
      removePendingOfflineOp(entry.id);
    }
  } finally {
    syncingOfflineOps = false;
    recomputeOfflineReserve();
    if(state.stockConflicts && state.stockConflicts.length) await saveState();
  }
}

/* ============================================================
   TEMA DE COR
============================================================ */
/* Clareia (percent > 0) ou escurece (percent < 0) uma cor hex, misturando
   com branco ou preto na proporção indicada. */
function shadeColor(hex, percent){
  let f = parseInt(hex.slice(1),16), t = percent<0 ? 0 : 255, p = percent<0 ? percent*-1 : percent;
  let R = f>>16, G = f>>8 & 0x00FF, B = f & 0x0000FF;
  return "#" + (0x1000000 + (Math.round((t-R)*p)+R)*0x10000 + (Math.round((t-G)*p)+G)*0x100 + (Math.round((t-B)*p)+B)).toString(16).slice(1);
}
function applyTheme(hex){
  if(!hex) return;
  const root = document.documentElement.style;
  root.setProperty('--primary', hex);
  root.setProperty('--primary-dark', shadeColor(hex, -0.28));
  root.setProperty('--primary-light', shadeColor(hex, 0.85));
}
async function selectThemeColor(hex){
  state.config.themeColor = hex;
  applyTheme(hex);
  await saveState();
  syncPublicBranding();
  render();
}

/* ---- Dados públicos da tela de login (nome da loja, cor do tema, fotos
   laterais) ----
   Todo o resto dos dados do app (produtos, vendas, caixa etc.) fica no
   documento pdv/pdv-state, que só pode ser lido depois de logar — e por
   isso a tela de login não tinha como saber o nome da loja ou mostrar as
   fotos configuradas: ela aparece ANTES do login. Este pequeno documento
   separado (pdv_meta/branding) guarda só essas informações de marca — nada
   sensível (nenhuma venda, produto ou dado do caixa) — e as regras do
   Firestore precisam permitir leitura dele sem estar logado. */
async function loadPublicBranding(){
  if(!fbAvailable || !fbDb) return;
  try{
    const doc = await withTimeout(fbDb.collection('pdv_meta').doc('branding').get(), 6000);
    if(doc.exists){
      const b = doc.data() || {};
      if(b.storeName) state.config.storeName = b.storeName;

    }
  }catch(e){
    // Não bloqueia o login por isso — só a marca (nome/fotos/cor) fica no
    // padrão até a próxima tentativa.
    console.error('Não foi possível carregar o nome/fotos da loja para a tela de login', e);
  }
  if(!currentUser){ try{ renderAuthScreen(); }catch(e){} }
}

let creatingAccountGuard = false; // evita corrida entre criar conta manualmente e o disparo automático do login
async function loadState(){
  loadLocalSettings();
  try{ await initFirebase(); }catch(e){ console.error('Erro ao iniciar Firebase', e); }

  if(fbAvailable && window.firebase && firebase.auth){
    // Com o Firebase disponível, o login passa a ser via Firebase Authentication.
    // As regras do Firestore agora exigem estar autenticado, então só carregamos
    // os dados do app DEPOIS que o login for confirmado — exceto o nome/fotos/cor
    // da loja, que vêm do documento público pdv_meta/branding (ver acima).
    loadPublicBranding();
    firebase.auth().onAuthStateChanged((user)=>{
      if(creatingAccountGuard) return; // estamos no meio de uma criação manual de conta
      if(user) handleFirebaseSignedIn(user);
      else{
        currentUser = null;
        userProfile = null;
        try{ render(); }catch(e){}
        try{ renderAuthScreen(); }catch(e){}
      }
    });
    return;
  }

  // Sem Firebase disponível agora: mantém o sistema antigo (usuários locais
  // com senha em hash), só pra funcionar nesse caso raro (offline/local).
  await loadLocalOnlyState();
}
async function handleFirebaseSignedIn(user){
  try{
    const profileDoc = await withTimeout(fbDb.collection('pdv_users').doc(user.uid).get(), 6000);
    if(!profileDoc.exists){
      await firebase.auth().signOut();
      currentUser = null; userProfile = null;
      alert('Seu acesso ainda não foi configurado ou foi removido. Fale com o administrador.');
      render(); renderAuthScreen();
      return;
    }
    userProfile = profileDoc.data();
    currentUser = { id:user.uid, username:user.email, role:userProfile.role, _authMode:'firebase' };
    _adminExists = true;
    ensureSetupFlag();
  }catch(e){
    console.error('Não foi possível carregar seu perfil de acesso', e);
    render();
    showCloudRetryScreen();
    return;
  }

  const defaultConfig = { ...state.config };
  try{
    const raw = await storageGet('pdv-state');
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
      state.config = Object.assign({}, defaultConfig, saved.config || {});
    }
  }catch(e){ console.error('Erro ao carregar dados salvos', e); }

  if(cloudFetchFailed){
    render();
    showCloudRetryScreen();
    return;
  }

  try{ applyTheme(state.config.themeColor || '#8A6D46'); }catch(e){ console.error('Erro ao aplicar tema', e); }
  try{ render(); }catch(e){ console.error('Erro ao renderizar o app', e); }
  try{ renderAuthScreen(); }catch(e){ console.error('Erro ao mostrar tela de login', e); }
  try{ watchRemoteChanges(); }catch(e){ console.error('Erro ao iniciar sincronização em tempo real', e); }
  try{ startPresenceHeartbeat(); recomputeOfflineReserve(); syncPendingOfflineOps(); }catch(e){ console.error('Erro ao iniciar reserva de estoque offline', e); }
  // Autocorreção: garante que o documento público de marca (nome/fotos/cor
  // da tela de login) exista e esteja atualizado, mesmo que essas
  // configurações já tivessem sido salvas antes desse recurso existir.
  try{ syncPublicBranding(); }catch(e){}
}
async function loadLocalOnlyState(){
  const defaultConfig = { ...state.config };
  let raw;
  try{
    raw = await storageGet('pdv-state');
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
      state.config = Object.assign({}, defaultConfig, saved.config || {});
    }
  }catch(e){
    console.error('Erro ao carregar dados salvos', e);
  }

  // Se a nuvem está configurada mas não respondeu agora, NÃO seguimos como se o
  // banco estivesse vazio — isso poderia apagar dados reais por cima. Mostra uma
  // tela de erro com "Tentar novamente" e não mexe em nada até conseguir ler de verdade.
  if(fbAvailable && cloudFetchFailed){
    render();
    showCloudRetryScreen();
    return;
  }

  try{
    if(!state.users) state.users = [];
    if(state.users.length===0){
      state.users.push({ id: uid(), username:'admin', passwordHash: DEFAULT_ADMIN_HASH, role:'admin' });
      await saveState();
    }
  }catch(e){ console.error('Erro ao preparar usuário padrão', e); }
  try{ applyTheme(state.config.themeColor || '#8A6D46'); }catch(e){ console.error('Erro ao aplicar tema', e); }
  // Garante que a tela sempre apareça, mesmo se algo acima falhar inesperadamente.
  try{ render(); }catch(e){ console.error('Erro ao renderizar o app', e); }
  try{ renderAuthScreen(); }catch(e){ console.error('Erro ao mostrar tela de login', e); }
  try{ watchRemoteChanges(); }catch(e){ console.error('Erro ao iniciar sincronização em tempo real', e); }
}

/* ============================================================
   AUTENTICAÇÃO
============================================================ */
async function hashPw(pw){
  try{
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // fallback simples caso crypto.subtle não esteja disponível (ex: página sem HTTPS)
    let h = 0;
    for(let i=0;i<pw.length;i++){ h = ((h<<5)-h + pw.charCodeAt(i))|0; }
    return 'fb_' + h;
  }
}

/* Controla se o botão "Criar conta de administrador" pode aparecer no login.
   null = ainda não checamos; true = já existe pelo menos 1 admin (esconde o
   botão); false = sistema novo, sem nenhum usuário ainda (permite o 1º cadastro).
   Por segurança, qualquer erro na checagem assume "true" (esconde o botão). */
let _adminExists = null;
async function checkAdminExists(){
  try{
    const snap = await withTimeout(fbDb.collection('pdv_users').limit(1).get(), 6000);
    _adminExists = !snap.empty;
  }catch(e){
    _adminExists = true;
  }
}
/* Garante que exista o documento pdv_meta/setup assim que um admin de verdade
   loga — é esse "carimbo" que as regras de segurança do Firestore usam pra
   saber que o sistema já foi configurado e bloquear qualquer novo
   autocadastro a partir daí (mesmo que alguém tente pular a tela e chamar o
   Firebase direto). Best-effort: se falhar, não afeta o login nem mais nada. */
function ensureSetupFlag(){
  if(!fbAvailable || !fbDb) return;
  fbDb.collection('pdv_meta').doc('setup').get().then(snap=>{
    if(!snap.exists){
      fbDb.collection('pdv_meta').doc('setup').set({ initializedAt: Date.now() }).catch(()=>{});
    }
  }).catch(()=>{});
}
/* Envolve o card de login/cadastro com as fotos laterais configuradas em
   Configuração → Fotos da tela de login (se houver). Em telas estreitas
   (celular) as fotos ficam ocultas via CSS — não há espaço vazio lá. */
function authScreenWrapper(cardHtml){
  const c = state.config || {};
  return `
    <div class="auth-wrap">
      <div class="auth-side-photo auth-side-left">${c.loginPhotoLeft ? `<img src="${c.loginPhotoLeft}" alt="">` : ''}</div>
      ${cardHtml}
      <div class="auth-side-photo auth-side-right">${c.loginPhotoRight ? `<img src="${c.loginPhotoRight}" alt="">` : ''}</div>
    </div>
  `;
}
function renderAuthScreen(){
  const box = document.getElementById('authScreen');
  if(fbAvailable && window.firebase && firebase.auth){
    if(currentUser){ box.style.display = 'none'; updateAppbar(); return; }
    box.style.display = 'flex';
    box.innerHTML = authScreenWrapper(window._showFirstAdminSetup ? renderFirebaseSetupAdmin() : renderFirebaseLogin());
    if(_adminExists===null){
      checkAdminExists().then(()=>{
        if(!currentUser && !window._showFirstAdminSetup) renderAuthScreen();
      });
    }
    updateAppbar();
    return;
  }
  if(!state.users || state.users.length===0){
    box.style.display = 'flex';
    box.innerHTML = authScreenWrapper(renderLocalSetupAdmin());
  } else if(!currentUser){
    box.style.display = 'flex';
    box.innerHTML = authScreenWrapper(renderLocalLogin());
  } else {
    box.style.display = 'none';
  }
  updateAppbar();
}

async function createFirebaseAdminAccount(){
  const email = document.getElementById('setup_email').value.trim();
  const pass = document.getElementById('setup_pass').value;
  const pass2 = document.getElementById('setup_pass2').value;
  const err = document.getElementById('setupError');
  if(!email || pass.length<6){ err.textContent = 'Preencha o e-mail e uma senha com pelo menos 6 caracteres.'; err.style.display='block'; return; }
  if(pass!==pass2){ err.textContent = 'As senhas não coincidem.'; err.style.display='block'; return; }
  creatingAccountGuard = true;
  try{
    // Checagem de segurança feita na hora, não só ao abrir a tela: se já existe
    // algum administrador, recusa — a única forma de criar acesso a partir daqui
    // é o administrador atual cadastrando em Configuração → Usuários.
    const existing = await withTimeout(fbDb.collection('pdv_users').limit(1).get(), 6000);
    if(!existing.empty){
      _adminExists = true;
      creatingAccountGuard = false;
      err.textContent = 'Já existe um administrador cadastrado. Peça pra ele criar seu acesso em Configuração → Usuários.';
      err.style.display = 'block';
      return;
    }
    const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
    await fbDb.collection('pdv_users').doc(cred.user.uid).set({ email, role:'admin', createdAt: Date.now() });
    creatingAccountGuard = false;
    window._showFirstAdminSetup = false;
    await handleFirebaseSignedIn(cred.user);
  }catch(e){
    creatingAccountGuard = false;
    err.textContent = translateFirebaseAuthError(e);
    err.style.display = 'block';
  }
}
async function doFirebaseLogin(){
  const email = document.getElementById('login_email').value.trim();
  const pass = document.getElementById('login_pass').value;
  const err = document.getElementById('loginError');
  try{
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    // o onAuthStateChanged cuida do resto (carregar perfil e dados)
  }catch(e){
    err.textContent = translateFirebaseAuthError(e);
    err.style.display = 'block';
  }
}
async function doForgotPassword(){
  const email = document.getElementById('login_email').value.trim();
  if(!email){ alert('Digite seu e-mail no campo acima primeiro, depois toque em "Esqueci minha senha".'); return; }
  try{
    await firebase.auth().sendPasswordResetEmail(email);
    alert('Enviamos um link de redefinição de senha pro seu e-mail. Confira a caixa de entrada (e o spam).');
  }catch(e){
    alert(translateFirebaseAuthError(e));
  }
}
function translateFirebaseAuthError(e){
  const map = {
    'auth/email-already-in-use': 'Esse e-mail já está cadastrado.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'Senha muito fraca (mínimo 6 caracteres).',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.'
  };
  return map[e.code] || ('Erro: ' + e.message);
}

  closeModal();

/* Confirma a senha do usuário logado no momento — funciona tanto com Firebase
   Authentication (reautentica de verdade) quanto com o sistema local antigo
   (compara o hash salvo). Usado antes de ações destrutivas (apagar tudo,
   restaurar backup). */
async function verifyCurrentUserPassword(password){
  if(!currentUser) return false;
  if(currentUser._authMode === 'firebase'){
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.username, password);
      await firebase.auth().currentUser.reauthenticateWithCredential(cred);
      return true;
    }catch(e){ return false; }
  }
  const hash = await hashPw(password);
  return hash === currentUser.passwordHash;
}

/* ---- Adicionar produto com quantidade ---- */
/* Quantidade máxima que pode ser vendida deste produto de uma vez: limitada
   ao estoque, exceto quando o produto está marcado como "sempre disponível"
   ou não tem controle de estoque (stock null). */
function maxQtyForProduct(p){
  if(!p) return 1;
  if(p.alwaysAvailable || p.stock==null) return Infinity;
  const reserve = remainingOfflineReserve(p.id);
  if(reserve!==null) return Math.min(reserve, Math.max(0, p.stock));
  return Math.max(0, p.stock);
}
/* Texto de estoque exibido nos cards de produto — mostra também a reserva
   offline (a fatia que só ESTE aparelho pode vender agora) quando a conexão
   está caída e o produto tem controle de estoque. */
function stockLabel(p){
  if(p.stock!=null && p.stock<=0) return '<span style="color:var(--accent);font-weight:700;">Sem estoque</span>';
  let label = 'Estoque: '+(p.stock ?? '-');
  const reserve = typeof p.stock==='number' ? remainingOfflineReserve(p.id) : null;
  if(reserve!==null) label += ` <span class="reserve-note">(sua reserva: ${reserve})</span>`;
  return label;
}
function openQtyModal(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p) return;
  const max = maxQtyForProduct(p);
  const existing = cart.find(c=>c.productId===pid);
  const startQty = Math.min(existing ? existing.qty : 1, max===Infinity?1e9:max) || 1;
  const startPrice = existing ? existing.price : p.price;
  const maxLabel = max===Infinity ? '' : `<div class="small muted" style="text-align:center;margin-top:4px;">Máximo disponível: ${max}</div>`;
  showModal(`
    <h3>${escapeHtml(p.name)}</h3>
    ${p.photo ? `<img src="${p.photo}" style="display:block;width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;margin:0 auto 12px;">` : ''}
    <label>Preço unitário</label>
    <input id="qtyModalPriceInput" type="text" inputmode="decimal" value="${startPrice.toFixed(2).replace('.',',')}" style="font-size:18px;font-weight:800;color:var(--primary);" oninput="updateQtySubtotal()">
    <div class="small muted" id="qtyOriginalPriceNote" style="margin-top:4px; display:${startPrice!==p.price?'block':'none'};">Preço de cadastro: ${fmt(p.price)}</div>
    <label style="margin-top:14px;">Quantidade</label>
    <div class="qty-ctrl" style="justify-content:center;gap:18px;margin:10px 0 4px;">
      <button style="width:44px;height:44px;font-size:22px;" onclick="stepQtyModal(-1)">−</button>
      <input id="qtyModalInput" type="number" min="1" ${max!==Infinity?`max="${max}"`:''} value="${startQty}" style="text-align:center;width:80px;font-size:18px;font-weight:700;" oninput="updateQtySubtotal()">
      <button style="width:44px;height:44px;font-size:22px;" onclick="stepQtyModal(1)">+</button>
    </div>
    ${maxLabel}
    <div class="row" style="margin-top:10px;"><span class="muted small">Subtotal</span><span id="qtySubtotal" style="font-weight:800;">${fmt(startPrice*startQty)}</span></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmAddQty('${pid}')">Adicionar ao carrinho</button>
    </div>
  `);
  window._qtyModalOriginalPrice = p.price;
  window._qtyModalMax = max;
}
function stepQtyModal(delta){
  const input = document.getElementById('qtyModalInput');
  const max = window._qtyModalMax===Infinity ? Infinity : window._qtyModalMax;
  let v = (parseInt(input.value)||1) + delta;
  if(v<1) v=1;
  if(max!==Infinity && v>max) v=max;
  input.value = v;
  updateQtySubtotal(window._qtyModalPrice);
}
function updateQtySubtotal(){
  const max = window._qtyModalMax===Infinity ? Infinity : window._qtyModalMax;
  const qtyInput = document.getElementById('qtyModalInput');
  let v = Math.max(1, parseInt(qtyInput.value)||1);
  if(max!==Infinity && v>max){ v=max; }
  qtyInput.value = v;
  const price = readMoneyInput('qtyModalPriceInput');
  document.getElementById('qtySubtotal').textContent = fmt(price*v);
  const note = document.getElementById('qtyOriginalPriceNote');
  if(note) note.style.display = (price!==window._qtyModalOriginalPrice) ? 'block' : 'none';
}
function confirmAddQty(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p) return;
  const max = maxQtyForProduct(p);
  let qty = Math.max(1, parseInt(document.getElementById('qtyModalInput').value)||1);
  if(max!==Infinity) qty = Math.min(qty, max);
  const price = readMoneyInput('qtyModalPriceInput');
  const existing = cart.find(c=>c.productId===pid);
  if(existing){
    existing.qty = qty;
    existing.price = price;
    if(price!==p.price) existing.originalPrice = p.price; else delete existing.originalPrice;
  } else {
    const item = {productId:pid, name:p.name, price, qty};
    if(price!==p.price) item.originalPrice = p.price;
    cart.push(item);
  }
  closeModal();
  render();
}
function changeQty(i, delta){
  const item = cart[i];
  const p = state.products.find(x=>x.id===item.productId);
  const max = maxQtyForProduct(p);
  let newQty = item.qty + delta;
  if(max!==Infinity && newQty>max) newQty = max;
  item.qty = newQty;
  if(item.qty<=0) cart.splice(i,1);
  render();
  if(document.getElementById('cartReviewList')) renderCartReview();
}
function removeCartItem(i){
  cart.splice(i,1);
  render();
  if(document.getElementById('cartReviewList')) renderCartReview();
}
/* ---- Alterar preço do item na venda (desconto pontual) ----
   Muda só o item que está no carrinho desta venda; o preço cadastrado do
   produto não é alterado, e a próxima venda volta a usar o preço normal. */
function openEditPriceModal(i){
  const item = cart[i];

function confirmEditPrice(i){

function cartTotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }
function renderCartBar(){

/* ---- Revisão do carrinho (lista antes de confirmar) ---- */
function openCartReview(){

    <h3>Confira a venda</h3>

function cancelCartSale(){

function renderCartReview(){

/* ---- Pagamento ----
   Fluxo único: o vendedor escolhe uma forma de pagamento e já aparece um
   campo pra digitar o valor pago por aquele meio (começa preenchido com o
   valor total restante). Se ele digitar um valor MENOR que o restante,
   ao confirmar esse valor entra automaticamente como pagamento parcial e o
   menu de formas de pagamento reaparece pra escolher o complemento — sem
   precisar de nenhum botão extra de "dividir pagamento". */
let selectedPayment = null;
const PAY_METHODS = ['Dinheiro','Débito','Crédito','Pix'];
function openPaymentModal(){
  if(!cart.length) return;
  selectedPayment = null;
  window._splitPayments = [];
  showModal(renderPaymentModalContent());
}
function paymentRemaining(){
  const total = cartTotal();
  const paidSoFar = window._splitPayments.reduce((a,p)=>a+p.amount,0);
  return +(total - paidSoFar).toFixed(2);
}
function renderPaymentModalContent(){
  const total = cartTotal();
  const remaining = paymentRemaining();
  const hasPartial = window._splitPayments.length>0;
  return `
    <h3>Forma de pagamento</h3>
    <div class="muted small">Total a receber</div>
    <div style="font-size:26px;font-weight:800;color:var(--primary);margin-bottom:6px;">${fmt(total)}</div>
    ${hasPartial ? `
      <div class="card" style="margin-bottom:10px;">
        ${window._splitPayments.map((p,i)=>`
          <div class="row" style="padding:6px 0;">
            <span>${p.method}</span>
            <span style="font-weight:700;display:flex;align-items:center;gap:8px;">${fmt(p.amount)} <button class="icon-btn" onclick="removeSplitPayment(${i})">✕</button></span>
          </div>`).join('')}
        <div class="row" style="padding-top:8px;border-top:1px solid var(--border);margin-top:4px;">
          <span class="muted small" style="font-weight:700;">Falta receber</span>
          <span style="font-weight:800;color:var(--danger);">${fmt(remaining)}</span>
        </div>
      </div>
    ` : ''}
    <div class="pay-grid" id="payGrid">
      ${PAY_METHODS.map(p=>`<button class="pay-chip ${selectedPayment===p?'selected':''}" onclick="selectPayment('${p}')" id="pc-${p}">${p}</button>`).join('')}
    </div>
    <div id="paymentAmountArea">${selectedPayment ? paymentAmountHtml(remaining) : ''}</div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="confirmPayBtn" ${selectedPayment ? '' : 'disabled'} onclick="confirmPaymentStep()">${hasPartial ? 'Adicionar' : 'Confirmar venda'}</button>
    </div>
  `;
}
function paymentAmountHtml(remaining){
  const isCash = selectedPayment==='Dinheiro';
  const defaultVal = remaining>0 ? remaining.toFixed(2).replace('.',',') : '';
  return `
    <label>Valor pago em ${selectedPayment}</label>
    <input type="text" inputmode="decimal" id="paymentAmountInput" placeholder="0,00" value="${defaultVal}" oninput="onPaymentAmountInput()">
    ${isCash ? `<div class="row" style="margin-top:8px;"><span class="muted small">Troco</span><span id="trocoVal" style="font-weight:800;">R$ 0,00</span></div>` : ''}
    <div id="paymentAmountHint" class="small muted" style="margin-top:6px;"></div>
    <div id="paymentAmountError" class="small" style="color:var(--danger); margin-top:6px; display:none;"></div>
  `;
}
function selectPayment(p){
  selectedPayment = p;
  showModal(renderPaymentModalContent());
}
function onPaymentAmountInput(){
  const remaining = paymentRemaining();
  const amount = readMoneyInput('paymentAmountInput');
  const isCash = selectedPayment==='Dinheiro';
  const trocoEl = document.getElementById('trocoVal');
  if(trocoEl) trocoEl.textContent = fmt(Math.max(amount-remaining,0));
  const tooMuch = !isCash && amount > remaining + 0.005;
  const err = document.getElementById('paymentAmountError');
  if(err){
    err.style.display = tooMuch ? 'block' : 'none';
    err.textContent = tooMuch ? `Esse valor é maior que o restante. ${selectedPayment} não tem troco.` : '';
  }
  const hint = document.getElementById('paymentAmountHint');
  if(hint){
    hint.textContent = (!tooMuch && amount>0 && amount + 0.005 < remaining)
      ? `Faltará ${fmt(remaining-amount)} — escolha outra forma de pagamento para completar.`
      : '';
  }
  const btn = document.getElementById('confirmPayBtn');
  if(btn){
    btn.disabled = tooMuch || amount<=0;
    btn.textContent = (amount + 0.005 >= remaining) ? 'Confirmar venda' : 'Adicionar';
  }
}
function confirmPaymentStep(){
  const remaining = paymentRemaining();
  const amount = readMoneyInput('paymentAmountInput');
  if(amount<=0){ alert('Informe um valor válido.'); return; }
  const isCash = selectedPayment==='Dinheiro';
  if(!isCash && amount > remaining + 0.005){
    alert(`Esse valor é maior que o restante a pagar. ${selectedPayment} não tem troco, então o valor não pode passar do que ainda falta.`);
    return;
  }
  window._splitPayments.push({ method: selectedPayment, amount });
  selectedPayment = null;
  if(paymentRemaining() <= 0.004){
    confirmSale();
  } else {
    // Ainda falta parte do valor: volta pro menu de formas de pagamento,
    // já mostrando quanto falta, pra escolher o complemento.
    showModal(renderPaymentModalContent());
  }
}
function removeSplitPayment(i){
  window._splitPayments.splice(i,1);
  showModal(renderPaymentModalContent());
}
async function confirmSale(){
  const total = cartTotal();
  const payments = window._splitPayments.map(p=>({...p}));
  if(!payments.length) return;
  const paidTotal = payments.reduce((a,p)=>a+p.amount,0);
  const troco = Math.max(+(paidTotal - total).toFixed(2), 0);
  const cashReceivedTotal = payments.filter(p=>p.method==='Dinheiro').reduce((a,p)=>a+p.amount,0);
  const sale = {
    id: uid(), date: new Date().toISOString(),
    items: cart.map(c=>({...c})), total,
    payments,
    payment: payments.length>1 ? 'Misto' : payments[0].method,
    received: cashReceivedTotal || null,
    troco,
    cancelled:false, exchanges:[]
  };
  await finalizeSale(sale);
}
async function finalizeSale(sale){
  let ok;
  if(!appIsOnline && fbAvailable){
    // Já sabemos que está offline: nem tenta esperar o servidor (evita travar
    // a venda por vários segundos). Aplica direto aqui — o limite já foi
    // garantido lá no carrinho por maxQtyForProduct — e marca pra reaplicar
    // com segurança assim que a conexão voltar.
    applySaleMutation(state, sale);
    await saveState();
    ok = false;
  } else {
    // atribui o número de ticket e baixa o estoque em cima do estado MAIS
    // RECENTE do servidor, evitando que dois aparelhos deem o mesmo número
    // ou vendam a mesma unidade numa venda simultânea
    ok = await runStateTransaction((s)=> applySaleMutation(s, sale));
  }
  if(!ok && fbAvailable){
    // não confirmado com o servidor (offline ou conexão caiu no meio da
    // venda): guarda numa fila local pra reconciliar quando a conexão voltar
    sale.items.forEach(it=> consumeOfflineReserve(it.productId, it.qty));
    queueOfflineOp('sale', sale);
  }
  lastReceipt = sale;
  cart = [];
  closeModal();
  showReceiptModal(sale);
  render();
}

/* ---- Ticket / Recibo ---- */
function paperCharsWidth(){ return state.config.printerWidth === '80' ? 42 : 32; }
/* Helpers de moldura (usa só +, - e | — funciona em qualquer impressora),
   compartilhados entre o ticket de venda e o ticket de troca. */
function makeBoxHelpers(W){
  const innerW = W - 2;
  const boxTop = () => '+' + '-'.repeat(innerW) + '+';
  const boxBottom = boxTop;
  const boxDivider = () => '|' + '-'.repeat(innerW) + '|';
  const boxBlank = () => '|' + ' '.repeat(innerW) + '|';
  const boxText = t => {
    if(t.length<=innerW){
      const pad = Math.max(0, Math.floor((innerW - t.length)/2));
      return '|' + ' '.repeat(pad) + t + ' '.repeat(Math.max(0, innerW-pad-t.length)) + '|';
    }
    const words = t.split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w=>{
      const test = cur ? cur+' '+w : w;
      if(test.length>innerW){ if(cur) lines.push(cur); cur = w; }
      else cur = test;
    });
    if(cur) lines.push(cur);
    return lines.map(l=>{
      const pad = Math.max(0, Math.floor((innerW-l.length)/2));
      return '|' + ' '.repeat(pad) + l + ' '.repeat(Math.max(0,innerW-pad-l.length)) + '|';
    }).join('\n');
  };
  const dottedSeparator = () => '\n' + '.'.repeat(W) + '\n\n';
  return { boxTop, boxBottom, boxDivider, boxBlank, boxText, dottedSeparator };
}
function buildReceiptText(sale){
  const c = state.config;
  const W = paperCharsWidth();
  const line = ch => ch.repeat(W);
  const center = t => { const pad = Math.max(0, Math.floor((W - t.length)/2)); return ' '.repeat(pad)+t; };
  const rowLR = (l,r) => l + ' '.repeat(Math.max(1, W-l.length-r.length)) + r;
  const dateStr = new Date(sale.date).toLocaleString('pt-BR');

  const { boxTop, boxBottom, boxDivider, boxBlank, boxText, dottedSeparator } = makeBoxHelpers(W);

  let out = '';

  // ---- um talão destacável por UNIDADE comprada (não por linha de item),
  //      para permitir retiradas separadas, uma de cada vez ----
  sale.items.forEach((it)=>{
    for(let unit=1; unit<=it.qty; unit++){
      const ticketNum = (it.ticketStart || 0) + (unit - 1);
      out += boxTop() + '\n';
      out += boxText(c.storeName||'Minha Loja') + '\n';
      out += boxText(dateStr) + '\n';
      out += boxDivider() + '\n';
      out += boxBlank() + '\n';
      out += boxText(it.name.toUpperCase()) + '\n';
      out += boxBlank() + '\n';
      out += boxText(fmt(it.price)) + '\n';
      out += boxBlank() + '\n';
      out += boxDivider() + '\n';
      out += boxText('Ticket Nº ' + ticketNum) + '\n';
      out += boxBottom() + '\n';
      out += dottedSeparator();
    }
  });

  // ---- talão final: resumo da venda (para o cliente guardar como comprovante) ----
  out += boxTop() + '\n';
  out += boxText(c.storeName||'Minha Loja') + '\n';
  if(c.address) out += boxText(c.address) + '\n';
  if(c.cnpj) out += boxText('CNPJ: '+c.cnpj) + '\n';
  out += boxText(dateStr) + '\n';
  out += boxDivider() + '\n';
  out += boxBlank() + '\n';
  sale.items.forEach(it=>{
    out += boxText(it.name) + '\n';
    if(it.originalPrice!==undefined && it.originalPrice!==it.price){
      out += boxText(`(preco de cadastro: ${fmt(it.originalPrice)})`) + '\n';
    }
    out += boxText(`${it.qty} x ${fmt(it.price)} = ${fmt(it.price*it.qty)}`) + '\n';
    if(it.ticketStart){
      const ticketEnd = it.ticketStart + it.qty - 1;
      const ticketLabel = it.qty>1 ? `Tickets Nº ${it.ticketStart} a ${ticketEnd}` : `Ticket Nº ${it.ticketStart}`;
      out += boxText(ticketLabel) + '\n';
    }
  });
  out += boxBlank() + '\n';
  out += boxDivider() + '\n';
  out += boxBlank() + '\n';
  out += boxText('TOTAL: ' + fmt(sale.total)) + '\n';
  if(sale.payment==='Misto'){
    out += boxText('Pagamento dividido:') + '\n';
    salePayments(sale).forEach(p=>{ out += boxText(p.method + ': ' + fmt(p.amount)) + '\n'; });
  } else {
    out += boxText('Pagamento: ' + sale.payment) + '\n';
  }
  if(sale.received){
    out += boxText('Recebido em dinheiro: ' + fmt(sale.received)) + '\n';
    if(sale.troco>0) out += boxText('Troco: ' + fmt(sale.troco)) + '\n';
  }
  out += boxBlank() + '\n';
  out += boxText(c.footer||'Obrigado pela preferência!') + '\n';
  out += boxBottom() + '\n';
  return out;
}
function showReceiptModal(sale, title){
  showModal(`
    <h3>${title || 'Venda concluída ✅'}</h3>
    <div id="receiptPaper">${buildReceiptText(sale)}</div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-outline" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" onclick="printReceipt()">🖨️ Imprimir</button>
    </div>
  `);
}
/* Ajusta o tamanho da página de impressão para o papel de bobina térmica
   (largura fixa conforme configurado, altura automática = só o tamanho do
   ticket, sem sobrar folha em branco). Precisa ser chamado antes de cada
   window.print(). */
function setupPrintLayout(){
  const widthMm = state.config.printerWidth === '80' ? 80 : 58;
  const sideMarginMm = 3.5;      // margem lateral de segurança
  const topBottomMarginMm = 2;
  const availableMm = widthMm - (sideMarginMm*2);
  const chars = paperCharsWidth();
  // largura média de um caractere em Courier New ≈ 0.62x o tamanho da fonte
  const fontSizeMm = +(availableMm / (chars*0.62)).toFixed(2);

  let styleEl = document.getElementById('dynamicPrintStyle');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'dynamicPrintStyle';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `
    @page{ size:${widthMm}mm auto; margin:0; }
    @media print{
      html, body{ margin:0 !important; padding:0 !important; height:auto !important; }
      #printArea{
        width:${widthMm}mm !important;
        padding:${topBottomMarginMm}mm ${sideMarginMm}mm !important;
        box-sizing:border-box;
        font-size:${fontSizeMm}mm !important;
        line-height:1.5 !important;
        font-weight:700 !important;
        -webkit-text-stroke:0.35px currentColor;
        color:#000 !important;
        word-break:break-word;
      }
    }
  `;
}
/* Remove acentos e caracteres especiais do texto antes de mandar pra impressão
   direta (RawBT / QZ Tray). Impressoras térmicas recebem texto puro, byte a
   byte, e a maioria não entende acentuação em UTF-8 — sem isso, "ê" vira
   "Ãª", espaços especiais viram "Â", etc. Removendo os acentos, o texto sai
   certinho em qualquer impressora, independente da página de código dela. */
function toPrinterSafeText(text){
  return text
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos (á,ê,ç,ã...)
    .replace(/\u00A0/g, ' ')  // espaço especial -> espaço normal
    .replace(/[^\x00-\x7E\n]/g, ''); // remove qualquer outro caractere fora do padrão básico
}
/* Envia o texto direto pro app RawBT (impressão térmica sem caixa de diálogo).
   O RawBT precisa estar instalado e com a impressora configurada como padrão nele.
   Só funciona no Android — não existe RawBT para computador. */
function sendToRawBt(text){
  const safeText = toPrinterSafeText(text);
  const b64 = btoa(unescape(encodeURIComponent(safeText)));
  const url = 'rawbt:base64,' + b64;
  window.location.href = url;
}
function isAndroid(){ return /Android/i.test(navigator.userAgent); }

/* ---- QZ Tray: impressão direta no computador, sem caixa de diálogo, mesmo
   com o app rodando online. Exige o programa gratuito QZ Tray instalado e
   aberto no computador (baixa em qz.io). O navegador conversa com ele por
   uma conexão local — nenhuma instalação de sistema é necessária além disso. ---- */
function loadQzTray(){
  return new Promise((resolve, reject)=>{
    if(window.qz){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Não foi possível carregar a biblioteca do QZ Tray. Verifique sua conexão com a internet.'));
    document.head.appendChild(s);
  });
}
function loadForge(){
  return new Promise((resolve, reject)=>{
    if(window.forge){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Não foi possível carregar a biblioteca de assinatura digital.'));

  });
}
