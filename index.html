<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PDV Fácil</title>
<style>
:root{--bg:#f7f1e7;--card:#fff;--primary:#8a6d46;--dark:#6b5236;--light:#f0e6d2;--accent:#c97c3d;--danger:#e5484d;--text:#2b2620;--muted:#8a7f6e;--border:#e8dfcd;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}.bar{height:58px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.bar b{font-size:18px}.status{font-size:12px}.view{padding:16px 16px 90px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1100px);height:66px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:5}.nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px}.nav button.active{color:var(--primary);font-weight:800}.nav span{display:block;font-size:21px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.product{border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left;padding:12px}.product strong{display:block}.product-photo{width:100%;height:115px;object-fit:cover;border-radius:9px;margin-bottom:9px;background:var(--light)}.product-photo.thumb{width:58px;height:58px;margin:0 10px 0 0;flex:none}.photo-preview{width:100%;max-height:210px;object-fit:contain;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--bg)}.price{color:var(--primary);font-weight:800;margin-top:5px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:750}.primary{background:var(--primary);color:#fff}.outline{background:#fff;border:1px solid var(--primary);color:var(--primary)}.danger{background:#fdebed;color:var(--danger)}.ghost{background:var(--light);color:var(--dark)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+.row{margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.auth{position:fixed;inset:0;background:var(--primary);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.auth .card{width:min(100%,380px)}.error{color:var(--danger);font-size:13px;margin-top:8px}.success{color:#407957;font-size:13px}.badge{padding:4px 8px;border-radius:99px;background:var(--light);font-size:11px;font-weight:700}.offline{background:#fff1ec;color:var(--accent);padding:8px;border-radius:9px;font-size:12px;margin-bottom:12px}.cart{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);width:min(100%,1100px);background:var(--dark);color:#fff;padding:12px 16px;display:none}.cart.show{display:flex;justify-content:space-between;align-items:center}.smallbtn{padding:7px 10px;border:0;border-radius:8px;background:var(--light);color:var(--dark)}table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="app"><header class="bar"><b id="storeName">PDV Fácil</b><div><span id="netStatus">Conectando…</span> <button id="logout" class="smallbtn" style="display:none" onclick="logout()">Sair</button></div></header><main id="view" class="view"></main><nav class="nav"><button data-tab="sale" onclick="tab('sale')"><span>🛒</span>Venda</button><button data-tab="products" onclick="tab('products')"><span>📦</span>Produtos</button><button data-tab="cash" onclick="tab('cash')"><span>💵</span>Caixa</button><button data-tab="history" onclick="tab('history')"><span>📊</span>Histórico</button><button data-tab="returns" onclick="tab('returns')"><span>🔄</span>Trocas</button><button data-tab="settings" onclick="tab('settings')"><span>⚙️</span>Config</button></nav><div id="cartBar" class="cart"></div></div>
<div id="auth" class="auth"></div><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="sheet" class="sheet"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
// IMPORTANTE: copie a apiKey EXATAMENTE do Firebase Console > Configurações do projeto > Seu app Web.
// A chave abaixo foi removida porque o Firebase informou que ela não é válida.
const firebaseConfig={apiKey:'AIzaSyBIxL5q02DVW6SvIIwsknQ8PDxH21OVC0s',authDomain:'pdv-facil-fa2ff.firebaseapp.com',projectId:'pdv-facil-fa2ff',storageBucket:'pdv-facil-fa2ff.firebasestorage.app',messagingSenderId:'940660086113',appId:'1:940660086113:web:86ee0f3c7e2540c85f2120'};
const firebaseReady=/^AIza[\w-]{30,}$/.test(firebaseConfig.apiKey);
if(firebaseReady) firebase.initializeApp(firebaseConfig);
const auth=firebaseReady?firebase.auth():null,db=firebaseReady?firebase.firestore():null;
const ADMIN_UID='Mafb3zRfjZNMeQ9hyh8DCQBo4Tt2',STORE_ID='loja-principal-v2';
const storeRef=db.collection('lojas').doc(STORE_ID), col=n=>storeRef.collection(n);const key='pdv-v2-queue';
let user=null,profile=null,tabName='sale',products=[],sales=[],members=[],cash=null,cart=[],settings={storeName:'Minha Loja',themeColor:'#8A6D46',printerWidth:'58',printMode:'dialog'},queue=JSON.parse(localStorage.getItem(key)||'[]');
let authNotice='';
const $=id=>document.getElementById(id), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setNet(){ $('netStatus').textContent=navigator.onLine?'Online':'Offline';$('netStatus').style.color=navigator.onLine?'#b7f3d4':'#ffd1c7'}window.addEventListener('online',()=>{setNet();syncQueue()});window.addEventListener('offline',setNet);setNet();
function authHtml(msg=''){return `<div class="card"><h2>Entrar no PDV</h2><p class="muted">Use o e-mail cadastrado no Firebase Authentication.</p><div class="field"><label>E-mail</label><input id="email" type="email" value="jaylsonalves@hotmail.com"></div><div class="field"><label>Senha</label><input id="pass" type="password" onkeydown="if(event.key==='Enter')login()"></div><div id="authErr" class="error">${msg}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">Entrar</button><button class="btn outline" style="width:100%;margin-top:8px" onclick="resetPassword()">Esqueci a senha</button></div>`}
function renderAuth(){if(!firebaseReady){$('auth').style.display='flex';$('auth').innerHTML=`<div class="card"><h2>Configuração do Firebase necessária</h2><p class="error">A API key configurada anteriormente foi recusada pelo Firebase.</p><p class="muted">No arquivo <b>index.html</b>, localize <code>COLE_AQUI_A_API_KEY_VALIDA_DO_FIREBASE</code> e substitua pelo valor <code>apiKey</code> copiado do Firebase Console → Configurações do projeto → Seu app Web.</p><p class="muted">Não inclua aspas extras, espaços ou quebras de linha. Depois publique novamente no GitHub Pages.</p></div>`;$('logout').style.display='none';return}if(user){$('auth').style.display='none';$('logout').style.display='inline-block'}else{$('auth').style.display='flex';$('auth').innerHTML=authHtml();$('logout').style.display='none'}}
async function login(){try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)}catch(e){$('authErr').textContent='Não foi possível entrar: '+friendly(e)}}async function resetPassword(){try{await auth.sendPasswordResetEmail($('email').value.trim());alert('Link enviado para o e-mail.')}catch(e){$('authErr').textContent=friendly(e)}}async function logout(){await auth.signOut()}function friendly(e){return e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'E-mail ou senha inválidos.':e.message}
function profileDefault(){return {uid:user.uid,email:user.email,role:user.uid===ADMIN_UID?'admin':'operator',mustChangePassword:true,onboardingVersion:1,active:true}}
async function load(){if(!user)return;let memberRef=col('members').doc(user.uid),p=await memberRef.get();if(!p.exists){if(user.uid===ADMIN_UID){profile=profileDefault();await memberRef.set({...profile,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else{authNotice='Sua conta ainda não foi autorizada para esta loja. Peça ao administrador para cadastrá-la.';await auth.signOut();return}}else{profile=p.data();if(!profile.active){authNotice='Esta conta está desativada. Fale com o administrador.';await auth.signOut();return}if(profile.onboardingVersion!==1){profile={...profile,mustChangePassword:true,onboardingVersion:1};await memberRef.set({mustChangePassword:true,onboardingVersion:1},{merge:true})}}let cfg=await col('meta').doc('config').get();if(cfg.exists)settings={...settings,...cfg.data()};let ps=await col('products').get();products=ps.docs.map(d=>({id:d.id,...d.data()}));let ss=await col('sales').orderBy('createdAt','desc').limit(300).get();sales=ss.docs.map(d=>({id:d.id,...d.data()}));let ms=await col('members').get();members=ms.docs.map(d=>({id:d.id,...d.data()}));let c=await col('cashSessions').where('open','==',true).limit(1).get();cash=c.empty?null:{id:c.docs[0].id,...c.docs[0].data()};$('storeName').textContent=settings.storeName||'PDV Fácil';render();syncQueue()}
function guard(){return user&&profile&&profile.active}function tab(t){if(t==='settings'&&profile.role!=='admin')return alert('Acesso restrito ao administrador.');tabName=t;render()}
function render(){if(!guard())return;if(profile.mustChangePassword){passwordChangeView();return}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabName));$('view').innerHTML=tabName==='sale'?saleView():tabName==='products'?productsView():tabName==='cash'?cashView():tabName==='history'?historyView():tabName==='returns'?returnsView():settingsView();cartBar()}
function passwordChangeView(){$('view').innerHTML=`<div class="card"><h2>Troca de senha obrigatória</h2><p class="muted">Por segurança, crie uma nova senha antes de usar o PDV.</p><div class="field"><label>Nova senha</label><input id="newPass" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></div><div class="field"><label>Confirmar nova senha</label><input id="confirmPass" type="password" autocomplete="new-password"></div><div id="passErr" class="error"></div><button class="btn primary" style="width:100%" onclick="changeInitialPassword()">Salvar nova senha</button></div>`;$('cartBar').classList.remove('show')}
async function changeInitialPassword(){let a=$('newPass').value,b=$('confirmPass').value,err=$('passErr');if(a.length<6){err.textContent='A senha precisa ter pelo menos 6 caracteres.';return}if(a!==b){err.textContent='As senhas não coincidem.';return}try{await user.updatePassword(a);await col('members').doc(user.uid).set({mustChangePassword:false,passwordChangedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});profile.mustChangePassword=false;render();alert('Senha alterada com sucesso.')}catch(e){err.textContent=e.code==='auth/requires-recent-login'?'Por segurança, saia e entre novamente para alterar a senha.':friendly(e)}}
function saleView(){let q=window.q||'';let list=products.filter(p=>(p.name+' '+(p.barcode||'')).toLowerCase().includes(q.toLowerCase())&&(p.alwaysAvailable||p.stock==null||p.stock>0));return `<div class="offline" style="display:${navigator.onLine?'none':'block'}">Offline controlado: vendas ficam na fila local e só usam reserva disponível neste aparelho.</div><div class="field"><input placeholder="🔎 Buscar produto ou código" value="${esc(q)}" oninput="window.q=this.value;render()"></div>${!cash?'<div class="card">Abra o caixa antes de vender.</div>':''}<div class="grid">${list.map(p=>`<button class="product" onclick="add('${p.id}')">${p.photo?`<img class="product-photo" src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">`:''}<strong>${esc(p.name)}</strong><span class="price">${money(p.price)}</span><span class="muted">Estoque: ${p.stock==null?'—':p.stock}</span></button>`).join('')}</div>`}
function add(pid){let p=products.find(x=>x.id===pid);if(!p)return;if(!cash)return alert('Abra o caixa antes de adicionar produtos à venda.');let inCart=cart.find(i=>i.productId===pid)?.qty||0;let available=typeof p.stock==='number'&&!p.alwaysAvailable?p.stock-inCart:999999;if(available<=0)return alert('Não há mais estoque disponível deste produto.');openModal(`<h3>Adicionar ao carrinho</h3>${p.photo?`<img class="photo-preview" src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">`:''}<p><b>${esc(p.name)}</b><br><span class="price">${money(p.price)}</span><br><span class="muted">Disponível: ${available===999999?'sem controle':available}</span></p><div class="row"><button class="smallbtn" onclick="adjustAddQty(-1,${available})">−</button><b id="addQty" style="font-size:22px">1</b><button class="smallbtn" onclick="adjustAddQty(1,${available})">+</button></div><div class="actions" style="margin-top:16px"><button class="btn outline" onclick="closeModal()">Continuar escolhendo</button><button class="btn primary" onclick="confirmAdd('${p.id}',${available})">Adicionar</button></div>`)}function adjustAddQty(change,max){let el=$('addQty'),next=Math.max(1,Math.min(max,Number(el.textContent)+change));el.textContent=next}function confirmAdd(pid,max){let p=products.find(x=>x.id===pid),qty=Number($('addQty').textContent);if(!p||qty<1)return;let x=cart.find(i=>i.productId===pid);if(x)x.qty+=qty;else cart.push({productId:pid,name:p.name,price:p.price,qty});closeModal();render()}
function paymentRemaining(){return Math.max(0,cartTotal()-(window.payments||[]).reduce((a,p)=>a+p.amount,0))}function updateCashPayment(){let isCash=$('pay').value==='Dinheiro',box=$('cashPayment');box.style.display=isCash?'block':'none';let input=$('amountReceived'),info=$('changeInfo'),remaining=paymentRemaining();if(!isCash){input.value=remaining.toFixed(2);info.className='muted';info.textContent='Será usado o valor restante: '+money(remaining)+'.';return}let received=Number(input.value||0),difference=received-remaining;if(!received){info.className='muted';info.textContent='Informe o valor entregue pelo cliente.';return}if(difference<0){info.className='error';info.textContent='Faltam '+money(Math.abs(difference))+'. Adicione este pagamento e escolha outra forma para complementar.';return}info.className='success';info.textContent=difference?'Troco: '+money(difference):'Valor exato.'}function addPayment(){let method=$('pay').value,amount=Number($('amountReceived').value||0),remaining=paymentRemaining();if(amount<=0)return alert('Informe um valor de pagamento.');if(method!=='Dinheiro'&&amount>remaining)amount=remaining;if(method==='Dinheiro'&&amount>remaining){window.payments.push({method,amount:remaining,received:amount,change:amount-remaining})}else window.payments.push({method,amount,received:amount,change:0});checkout()}function removePayment(i){window.payments.splice(i,1);checkout()}
function removeCartItem(productId){let item=cart.find(x=>x.productId===productId);if(!item)return;if(item.qty>1)item.qty--;else cart=cart.filter(x=>x.productId!==productId);window.payments=[];if(!cart.length){closeModal();render();return}checkout()}
function cancelSale(){if(!confirm('Cancelar esta venda? Todos os itens e pagamentos informados serão removidos.'))return;cart=[];window.payments=[];closeModal();render()}
function cartTotal(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}function cartBar(){let b=$('cartBar');if(!cart.length){b.classList.remove('show');return}b.classList.add('show');b.innerHTML=`<span>${cart.reduce((a,x)=>a+x.qty,0)} itens · <b>${money(cartTotal())}</b></span><button class="smallbtn" onclick="checkout()">Pagamento</button>`}
function checkout(){window.payments=window.payments||[];let remaining=paymentRemaining(),paid=cartTotal()-remaining,change=window.payments.reduce((a,p)=>a+(p.change||0),0);openModal(`<h3>Confirmar venda</h3>${cart.map(x=>`<div class="row"><span>${esc(x.name)} × ${x.qty}</span><div class="row"><b>${money(x.price*x.qty)}</b><button class="smallbtn" onclick="removeCartItem('${x.productId}')" title="Remover uma unidade">−</button></div></div>`).join('')}<hr><div class="row"><b>Total</b><b>${money(cartTotal())}</b></div>${window.payments.length?`<div class="card" style="padding:10px;margin:10px 0"><b>Pagamentos adicionados</b>${window.payments.map((p,i)=>`<div class="row"><span>${esc(p.method)} · ${money(p.amount)}${p.change?' · recebido '+money(p.received):''}</span><button class="smallbtn" onclick="removePayment(${i})">Remover</button></div>`).join('')}</div>`:''}<div class="row"><b>Falta pagar</b><b class="${remaining?'error':'success'}">${money(remaining)}</b></div>${change?`<div class="row"><b>Troco</b><b class="success">${money(change)}</b></div>`:''}${remaining>0?`<div class="field"><label>Adicionar forma de pagamento</label><select id="pay" onchange="updateCashPayment()"><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Pix</option></select><div id="cashPayment" class="field"><label>Valor recebido / valor nesta forma</label><input id="amountReceived" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" oninput="updateCashPayment()"><div id="changeInfo" class="muted" style="margin-top:8px">Informe o valor entregue pelo cliente.</div></div><button class="btn outline" style="width:100%;margin-top:4px" onclick="addPayment()">+ Adicionar pagamento</button></div>`:''}<div class="actions"><button class="btn danger" onclick="cancelSale()">Cancelar venda</button><button class="btn outline" onclick="closeModal()">Continuar comprando</button><button class="btn primary" ${remaining>0?'disabled':''} onclick="createSale()">Finalizar</button></div>`);if(remaining>0)updateCashPayment()}
async function createSale(){
  if(!cart.length||!cash)return;
  window.payments=window.payments||[];
  if(paymentRemaining()>0.001)return alert('Ainda falta pagar '+money(paymentRemaining())+'.');
  const payments=window.payments.map(p=>({...p}));
  const payment=payments.map(p=>p.method).join(' + ')||'Não informado';
  const amountReceived=payments.reduce((sum,p)=>sum+Number(p.received||p.amount||0),0);
  const change=payments.reduce((sum,p)=>sum+Number(p.change||0),0);
  const sale={id:id(),cashId:cash.id,deviceId:deviceId(),userId:user.uid,items:cart.map(x=>({...x})),total:cartTotal(),payments,payment,amountReceived,change,status:'confirmed',createdAt:firebase.firestore.FieldValue.serverTimestamp(),clientCreatedAt:Date.now()};
  try{
    const registeredSale=await commitSale(sale);
    alert('Venda registrada. Ticket nº '+registeredSale.ticketNumber+'.');
    cart=[];window.payments=[];closeModal();await load();printReceipt(registeredSale);
  }catch(e){
    const offline=!navigator.onLine||e.code==='unavailable'||e.code==='failed-precondition'||/network|offline|unavailable/i.test(e.message||'');
    if(offline){
      queue.push({...sale,createdAt:null});localStorage.setItem(key,JSON.stringify(queue));cart=[];window.payments=[];closeModal();render();
      alert('Sem conexão com o servidor. Venda colocada na fila offline e será sincronizada quando a conexão voltar.');
    }else{alert('A venda não foi registrada: '+friendly(e));console.error('Erro ao registrar venda:',e)}
  }
}
async function commitSale(sale){let refs=sale.items.map(i=>col('products').doc(i.productId)),counterRef=col('meta').doc('counters');let registeredSale;await db.runTransaction(async tx=>{let counterSnap=await tx.get(counterRef),nextTicket=Number(counterSnap.data()?.lastTicketNumber||0)+1;let snaps=[];for(let r of refs)snaps.push(await tx.get(r));snaps.forEach((s,n)=>{let p=s.data()||{};if(typeof p.stock==='number'&&!p.alwaysAvailable&&p.stock<sale.items[n].qty)throw Error('Estoque insuficiente para '+(p.name||''));});snaps.forEach((s,n)=>{let p=s.data()||{};if(typeof p.stock==='number'&&!p.alwaysAvailable)tx.update(refs[n],{stock:p.stock-sale.items[n].qty,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});registeredSale={...sale,ticketNumber:nextTicket};tx.set(counterRef,{lastTicketNumber:nextTicket,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});tx.create(col('sales').doc(sale.id),registeredSale);tx.create(col('audit').doc(id()),{type:'sale',saleId:sale.id,ticketNumber:nextTicket,userId:user.uid,deviceId:deviceId(),at:firebase.firestore.FieldValue.serverTimestamp()})});return registeredSale}
async function syncQueue(){if(!navigator.onLine||!user)return;let left=[];for(const s of queue){try{await commitSale(s)}catch(e){left.push(s);console.error('Não foi possível sincronizar venda pendente:',e)}}queue=left;localStorage.setItem(key,JSON.stringify(queue));if(!left.length)render()}
function deviceId(){let d=localStorage.getItem('pdv-device-id');if(!d){d=id();localStorage.setItem('pdv-device-id',d)}return d}
function productsView(){return `<div class="actions"><button class="btn primary" onclick="productForm()">+ Produto</button><button class="btn outline" onclick="reload()">Atualizar</button></div><h3>Produtos (${products.length})</h3>${products.map(p=>`<div class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · Estoque: ${p.stock==null?'sem controle':p.stock}</div></div><button class="smallbtn" onclick="productForm('${p.id}')">Editar</button></div></div>`).join('')}`}
function productForm(pid){let p=products.find(x=>x.id===pid)||{};openModal(`<h3>${pid?'Editar':'Novo'} produto</h3><div class="field"><label>Nome</label><input id="pn" value="${esc(p.name||'')}"></div><div class="field"><label>Preço</label><input id="pp" type="number" step="0.01" value="${p.price||''}"></div><div class="field"><label>Estoque (vazio = sem controle)</label><input id="ps" type="number" value="${p.stock??''}"></div><div class="field"><label>Foto do produto</label><input id="photoFile" type="file" accept="image/*" onchange="previewProductPhoto(this)"><div class="muted">Escolha uma foto salva no celular ou computador.</div><img id="photoPreview" class="photo-preview" src="${esc(p.photo||'')}" alt="Prévia da foto" style="display:${p.photo?'block':'none'}"><input id="currentPhoto" type="hidden" value="${esc(p.photo||'')}"></div><div class="actions"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct('${pid||''}')">Salvar</button></div>`)}
async function previewProductPhoto(input){let file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Escolha um arquivo de imagem.');try{let photo=await compressProductPhoto(file);$('currentPhoto').value=photo;$('photoPreview').src=photo;$('photoPreview').style.display='block'}catch(e){alert('Não foi possível preparar esta foto. Tente outra imagem.')}}
function compressProductPhoto(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let photo=c.toDataURL('image/jpeg',.72);if(photo.length>700000)return reject(new Error('Foto grande demais'));resolve(photo)};img.src=reader.result};reader.readAsDataURL(file)})}
async function saveProduct(pid){let name=$('pn').value.trim(),price=Number($('pp').value),raw=$('ps').value,photo=$('currentPhoto').value;if(!name||price<=0)return alert('Preencha nome e preço.');let ref=pid?col('products').doc(pid):col('products').doc(id()),data={name,price,stock:raw===''?null:Math.max(0,Number(raw)),photo:photo||null,alwaysAvailable:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await ref.set(data,{merge:true});closeModal();await load()}
function cashView(){if(!cash)return `<div class="card"><h3>Caixa fechado</h3><div class="field"><label>Valor inicial</label><input id="opening" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div><button class="btn primary" style="width:100%" onclick="openCash()">Abrir caixa</button></div>`;let sessionSales=sales.filter(s=>s.cashId===cash.id&&s.status!=='returned').reduce((a,s)=>a+Number(s.total||0),0),opening=Number(cash.openingAmount||0),expected=opening+sessionSales;return `<div class="card"><h3>Caixa aberto</h3><div class="row"><span>Aberto em</span><b>${new Date(cash.openedAt?.toDate?.()||cash.openedAt||Date.now()).toLocaleString('pt-BR')}</b></div><div class="row"><span>Valor inicial</span><b>${money(opening)}</b></div><div class="row"><span>Vendas na sessão</span><b>${money(sessionSales)}</b></div><div class="row"><span><b>Valor esperado no caixa</b></span><b class="success">${money(expected)}</b></div></div><button class="btn danger" style="width:100%" onclick="closeCash()">Fechar caixa</button>`}
async function openCash(){let ref=col('cashSessions').doc(id()),data={open:true,openedAt:firebase.firestore.FieldValue.serverTimestamp(),openingAmount:Number($('opening').value||0),userId:user.uid,deviceId:deviceId()};await ref.set(data);await load()}async function closeCash(){if(!confirm('Fechar este caixa?'))return;await col('cashSessions').doc(cash.id).update({open:false,closedAt:firebase.firestore.FieldValue.serverTimestamp()});await load()}
function historyView(){return `<h3>Últimas vendas</h3>${sales.slice(0,100).map(s=>`<div class="card"><div class="row"><span><b>Ticket nº ${s.ticketNumber??'—'}</b> · ${s.payment||''} · ${s.status==='returned'?'DEVOLVIDA':'Confirmada'}</span><b>${money(s.total)}</b></div><div class="muted">${s.items?.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')||''}</div></div>`).join('')||'<div class="card">Nenhuma venda.</div>'}`}
function returnsView(){let term=String(window.returnTicket||'').trim(),available=sales.filter(s=>s.status!=='returned'&&(!term||String(s.ticketNumber||'').includes(term)));return `<h3>Troca / devolução</h3><div class="card"><p class="muted">Localize a venda pelo número do ticket e confirme a devolução integral. O estoque será restaurado.</p><div class="field"><label>Número do ticket</label><input inputmode="numeric" placeholder="Ex.: 125" value="${esc(term)}" oninput="window.returnTicket=this.value;render()"></div></div>${available.map(s=>`<div class="card"><div class="row"><div><b>Ticket nº ${s.ticketNumber??'—'}</b><div><b>${money(s.total)}</b></div><div class="muted">${esc(s.payment||'')} · ${s.items?.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')||''}</div></div><button class="smallbtn" onclick="confirmReturn('${s.id}')">Devolver</button></div></div>`).join('')||'<div class="card">Nenhuma venda encontrada para este ticket.</div>'}`}
function confirmReturn(saleId){let s=sales.find(x=>x.id===saleId);if(!s)return;if(!confirm(`Confirmar devolução de ${money(s.total)}? O estoque será restaurado.`))return;returnSale(saleId)}
async function returnSale(saleId){try{await db.runTransaction(async tx=>{let saleRef=col('sales').doc(saleId),snap=await tx.get(saleRef);if(!snap.exists)throw Error('Venda não encontrada.');let s=snap.data();if(s.status==='returned')throw Error('Esta venda já foi devolvida.');for(const item of s.items||[]){let productRef=col('products').doc(item.productId),productSnap=await tx.get(productRef);if(productSnap.exists){let p=productSnap.data();if(typeof p.stock==='number'&&!p.alwaysAvailable)tx.update(productRef,{stock:p.stock+Number(item.qty||0),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}}tx.update(saleRef,{status:'returned',returnedAt:firebase.firestore.FieldValue.serverTimestamp(),returnedBy:user.uid});tx.create(col('returns').doc(id()),{saleId,userId:user.uid,deviceId:deviceId(),total:s.total,items:s.items||[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});tx.create(col('audit').doc(id()),{type:'return',saleId,userId:user.uid,deviceId:deviceId(),at:firebase.firestore.FieldValue.serverTimestamp()})});alert('Devolução registrada e estoque restaurado.');await load()}catch(e){alert('Não foi possível concluir a devolução: '+friendly(e));console.error('Erro ao devolver venda:',e)}}
function settingsView(){return `<h3>Configuração</h3><div class="card"><div class="field"><label>Nome da loja</label><input id="sn" value="${esc(settings.storeName)}"></div><div class="field"><label>Largura da bobina</label><select id="sw"><option value="58" ${settings.printerWidth==='58'?'selected':''}>58mm</option><option value="80" ${settings.printerWidth==='80'?'selected':''}>80mm</option></select></div><div class="field"><label>Impressão de tickets</label><select id="pm"><option value="dialog" ${settings.printMode==='dialog'?'selected':''}>Computador/USB — abrir diálogo de impressão</option><option value="rawbt" ${settings.printMode==='rawbt'?'selected':''}>Android Bluetooth — RawBT</option></select><div class="muted">No computador, instale a impressora USB no sistema operacional e selecione-a na janela de impressão. No Android, instale o RawBT, pareie a impressora Bluetooth e escolha RawBT aqui.</div></div><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div><div class="card"><div class="row"><div><b>Usuários da loja</b><div class="muted">Cadastre operadores, defina a função e desative acessos.</div></div><button class="smallbtn" onclick="userForm()">+ Usuário</button></div>${members.map(m=>`<div class="row" style="padding-top:10px"><div><b>${esc(m.email||'Sem e-mail')}</b><div class="muted">${m.role==='admin'?'Administrador':'Operador'} · ${m.active===false?'Desativado':'Ativo'}${m.mustChangePassword?' · deve trocar senha':''}</div></div>${m.uid!==user.uid?`<button class="smallbtn" onclick="toggleUser('${m.id}')">${m.active===false?'Ativar':'Desativar'}</button>`:'<span class="badge">Você</span>'}</div>`).join('')||'<div class="muted" style="margin-top:10px">Nenhum usuário cadastrado.</div>'}</div><div class="card"><b>Dispositivo</b><div class="muted">ID: ${esc(deviceId())}</div><div class="muted">Fila offline: ${queue.length} operação(ões)</div></div>`}
function userForm(){openModal(`<h3>Novo usuário</h3><p class="muted">A pessoa deverá trocar esta senha no primeiro acesso.</p><div class="field"><label>Nome (opcional)</label><input id="un" placeholder="Ex.: Maria"></div><div class="field"><label>E-mail</label><input id="ue" type="email" placeholder="nome@empresa.com"></div><div class="field"><label>Senha temporária</label><input id="up" type="password" minlength="6" placeholder="Mínimo de 6 caracteres"></div><div class="field"><label>Função</label><select id="ur"><option value="operator">Operador</option><option value="admin">Administrador</option></select></div><div class="actions"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="createUser()">Cadastrar</button></div>`)}
async function createUser(){let name=$('un').value.trim(),email=$('ue').value.trim().toLowerCase(),password=$('up').value,role=$('ur').value;if(!/^\S+@\S+\.\S+$/.test(email))return alert('Informe um e-mail válido.');if(password.length<6)return alert('A senha temporária precisa ter pelo menos 6 caracteres.');try{let secondary;try{secondary=firebase.app('pdv-user-provisioning')}catch(_){secondary=firebase.initializeApp(firebaseConfig,'pdv-user-provisioning')}let credential=await secondary.auth().createUserWithEmailAndPassword(email,password),newUser=credential.user;await col('members').doc(newUser.uid).set({uid:newUser.uid,name,email,role,active:true,mustChangePassword:true,onboardingVersion:1,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:user.uid});await secondary.auth().signOut();closeModal();await load();alert('Usuário cadastrado. Informe a ele o e-mail e a senha temporária.')}catch(e){alert('Não foi possível cadastrar o usuário: '+friendly(e));console.error('Erro ao cadastrar usuário:',e)}}
async function toggleUser(uid){let m=members.find(x=>x.id===uid);if(!m||!confirm(`${m.active===false?'Ativar':'Desativar'} o acesso de ${m.email}?`))return;await col('members').doc(uid).update({active:m.active===false,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.uid});await load()}
async function saveSettings(){settings.storeName=$('sn').value.trim()||'Minha Loja';settings.printerWidth=$('sw').value;settings.printMode=$('pm').value;await col('meta').doc('config').set(settings,{merge:true});await load();alert('Configurações de impressão salvas.')}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function receipt(s){return [settings.storeName,'TICKET Nº '+(s.ticketNumber??'PENDENTE'),'------------------------------',...s.items.map(i=>`${i.qty} x ${i.name}  ${money(i.price*i.qty)}`),'------------------------------','TOTAL: '+money(s.total),'Pagamento: '+s.payment,'Obrigado pela preferência!'].join('\n')}
function printReceipt(s){let text=receipt(s);if(localStorage.getItem('pdv-print')==='rawbt'&&/Android/i.test(navigator.userAgent)){location.href='rawbt:base64,'+btoa(unescape(encodeURIComponent(text)));return}let w=window.open('','_blank');if(w){w.document.write('<pre style="font:14px monospace;white-space:pre-wrap">'+esc(text)+'</pre>');w.print();w.close()}}
if(firebaseReady){auth.onAuthStateChanged(async u=>{user=u;renderAuth(authNotice);if(u){authNotice='';await load()}else{$('view').innerHTML=''}})}else{renderAuth()}
</script></body></html>
